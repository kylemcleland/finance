      moving: false, t: 0, dur: 0.2, parity: 0, resolve: null, visible: true, bubble: 0, hop: 0,
    };
  }
  function startMove(e, dir, speed) {
    e.dir = dir;
    e.fx = e.x; e.fy = e.y;
    e.x += DX[dir]; e.y += DY[dir];
    e.t = 0; e.dur = 1 / speed; e.moving = true;
    e.parity ^= 1;
  }
  function updateEnt(e, dt) {
    if (!e.moving) return false;
    e.t += dt;
    const k = Math.min(1, e.t / e.dur);
    e.px = (e.fx + (e.x - e.fx) * k) * TS;
    e.py = (e.fy + (e.y - e.fy) * k) * TS;
    if (k >= 1) {
      e.moving = false;
      e.fx = e.x; e.fy = e.y;
      if (e.resolve) { const r = e.resolve; e.resolve = null; r(); }
      return true;
    }
    return false;
  }
  function entFrame(e) {
    if (!e.moving) return 0;
    const k = e.t / e.dur;
    return k < 0.5 ? (e.parity ? 1 : 2) : 0;
  }
  function moveAwait(e, dir, speed) {
    return new Promise((res) => {
      startMove(e, dir, speed);
      e.resolve = res;
    });
  }
  function place(e, x, y) { e.x = e.fx = x; e.y = e.fy = y; e.px = x * TS; e.py = y * TS; e.moving = false; }

  // ------------------------------------------------------------------ map queries
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < S.w && y < S.h; }
  function tileAt(x, y) { return inBounds(x, y) ? S.rows[y][x] || '.' : '"'; }
  function tileSolid(x, y) {
    if (!inBounds(x, y)) return true;
    return G.tiles.solid(S.rows[y][x] || '.');
  }
  function objAt(x, y) {
    for (let i = 0; i < S.objects.length; i++) { const o = S.objects[i]; if (o.x === x && o.y === y && !o.gone) return o; }
    return null;
  }
  function npcAt(x, y, except) {
    for (let i = 0; i < S.npcs.length; i++) {
      const n = S.npcs[i];
      if (!n.visible || n === except) continue;
      if ((n.x === x && n.y === y) || (n.moving && n.fx === x && n.fy === y)) return n;
    }
    return null;
  }
  function signAt(x, y) {
    const s = S.map.signs;
    if (!s) return null;
    for (let i = 0; i < s.length; i++) if (s[i].x === x && s[i].y === y) return s[i];
    return null;
  }
  function warpAt(x, y) {
    const w = S.map.warps;
    if (!w) return null;
    for (let i = 0; i < w.length; i++) if (w[i].x === x && w[i].y === y) return w[i];
    return null;
  }
  function blocked(x, y, forNpc) {
    if (tileSolid(x, y)) return true;
    const o = objAt(x, y);
    if (o && o.type === 'chest') return true;
    if (o && forNpc) return true;
    if (npcAt(x, y, forNpc)) return true;
    if (forNpc) {
      const p = S.player;
      if ((p.x === x && p.y === y) || (p.fx === x && p.fy === y)) return true;
    }
    return false;
  }
  const flagOf = (o) => 'chest_' + S.map.id + '_' + (o.id != null ? o.id : o.x + '_' + o.y);

  // ------------------------------------------------------------------ map entry
  function enterMap(mapId, x, y, dir) {
    const map = getMap(mapId);
    hiddenOverride = {};
    S.map = map;
    S.mapGfx = gfxFor(map);
    S.rows = map.tiles; S.w = S.mapGfx.w; S.h = S.mapGfx.h;
    S.objects = (map.objects || []).map((o) => Object.assign({ gone: false, open: false, bounce: 0 }, o));
    S.npcs = (map.npcs || []).map((d) => makeNpc(d));
    const p = S.player;
    if (!inBounds(x, y) || (tileSolid(x, y) && !(map.warps || []).some((w) => w.x === x && w.y === y))) {
      const f = findOpen(x | 0, y | 0);
      if (!inBounds(x, y)) console.warn('world: start position out of bounds', mapId, x, y);
      x = f.x; y = f.y;
    }
    place(p, x, y);
    p.dir = dir || p.dir || 'down';
    S.walking = false; S.turnT = 0;
    G.state.map = map.id; G.state.x = x; G.state.y = y; G.state.dir = p.dir;
    S.noEnc = 4;
    S.rustle.length = 0;
    W.refresh();
    snapCamera();
    if (map.music) G.music.play(map.music);
    if (map.outdoor !== false && map.name && map.name !== S.lastOutdoorName) {
      S.lastOutdoorName = map.name;
      S.banner = { text: map.name, t: 0 };
    }
  }
  function findOpen(x, y) {
    for (let r = 0; r < 30; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx, ny) && !tileSolid(nx, ny) && !objAt(nx, ny) && !warpAt(nx, ny)) return { x: nx, y: ny };
      }
    }
    return { x: 0, y: 0 };
  }
  function makeNpc(d) {
    const n = Object.create(d);
    const e = makeEnt(d.look || 'villagerM', d.x, d.y, d.dir || 'down');
    Object.assign(n, e);
    n.def = d; n.home = { x: d.x, y: d.y }; n.timer = U.rand(0.8, 3); n.engaged = false; n.scripted = 0;
    return n;
  }
  async function runOnEnter() {
    const m = S.map;
    if (m && typeof m.onEnter === 'function') await runScript(m.onEnter);
  }

  // ------------------------------------------------------------------ scripts
  async function runScript(fn, ...args) {
    if (typeof fn !== 'function') return;
    const st = S;
    st.lock++;
    try { await fn(G.cmd, ...args); } catch (e) { console.error('world: script error', e); }
    finally {
      st.lock = Math.max(0, st.lock - 1);
      if (S === st) W.refresh();
    }
  }
  const locked = () => !S || S.lock > 0 || G.ui.busy();

  // ------------------------------------------------------------------ warps & edges
  async function doWarp(mapId, x, y, dir, o = {}) {
    if (!S) {
      Object.assign(G.state, { map: mapId, x, y, dir: dir || G.state.dir });
      W.start();
      return;
    }
    const st = S;
    st.lock++;
    try {
      if (!o.silent) G.sfx.play('door');
      st.player.moving = false;
      await G.scenes.fade(() => {
        enterMap(mapId, x, y, dir || st.player.dir);
        G.save();
      }, { ms: o.ms || 220 });
    } finally { st.lock = Math.max(0, st.lock - 1); }
    await runOnEnter();
  }
  function edgeFor(dir) {
    const e = S.map.edges;
    if (!e) return null;
    const side = dir === 'up' ? 'north' : dir === 'down' ? 'south' : dir === 'left' ? 'west' : 'east';
    const ed = e[side];
    if (!ed || !ed.to || !G.maps[ed.to]) return null;
    const tm = G.maps[ed.to];
    const th = tm.tiles.length, tw = tm.tiles[0].length;
    const p = S.player, off = ed.offset || 0;
    let tx = p.x, ty = p.y;
    if (side === 'north') { tx = p.x + off; ty = th - 1; }
    if (side === 'south') { tx = p.x + off; ty = 0; }
    if (side === 'west') { tx = tw - 1; ty = p.y + off; }
    if (side === 'east') { tx = 0; ty = p.y + off; }
    return { to: ed.to, x: U.clamp(tx, 0, tw - 1), y: U.clamp(ty, 0, th - 1) };
  }

  // ------------------------------------------------------------------ interaction
  function facedTile() {
    const p = S.player;
    return { x: p.x + DX[p.dir], y: p.y + DY[p.dir] };
  }
  async function interactAt(x, y) {
    const p = S.player;
    let n = npcAt(x, y);
    // talk across counters
    if (!n && G.tiles.defs[tileAt(x, y)] && G.tiles.defs[tileAt(x, y)].counter) n = npcAt(x + DX[p.dir], y + DY[p.dir]);
    if (n) return talkTo(n);
    const s = signAt(x, y);
    if (s) { G.sfx.play('select'); return runScript(async (c) => { await c.say(s.text); }); }
    const o = objAt(x, y);
    if (o) return openObject(o);
    const w = warpAt(x, y);
    if (w && G.tiles.defs[tileAt(x, y)] && G.tiles.defs[tileAt(x, y)].door) return doWarp(w.to, w.tx, w.ty, w.dir);
    if (tileAt(x, y) === 'S') return runScript(async (c) => { await c.say('The sign is too weathered to read.'); });
    return false;
  }
  async function talkTo(n) {
    const p = S.player;
    S.lock++;
    try {
      while (n.moving) await U.sleep(16);
      const dx = p.x - n.x, dy = p.y - n.y;
      n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      if (n.trainer && !(n.trainer.flag && G.state.flags[n.trainer.flag])) {
        await trainerBattle(n);
      } else if (typeof n.script === 'function') {
        await runScript(n.script, n);
      } else if (n.trainer) {
        await runScript(async (c) => c.say(n.trainer.after || n.trainer.win || '...', { name: n.name, look: n.look }));
      } else if (n.text) {
        await runScript(async (c) => c.say(n.text, { name: n.name, look: n.look }));
      }
    } finally { S.lock = Math.max(0, S.lock - 1); W.refresh(); }
  }
  async function openObject(o) {
    const fl = flagOf(o);
    if (o.type === 'item') return pickup(o);
    if (o.type !== 'chest') return;
    await runScript(async (c) => {
      if (G.state.flags[fl]) { await c.say('The chest is empty.'); return; }
      G.sfx.play('door');
      o.bounce = 1;
      await c.wait(250);
      G.state.flags[fl] = true;
      await grant(c, o);
    });
  }
  async function grant(c, o) {
    const qty = o.qty || 1;
    if (o.gold || o.item === 'gold') {
      const g = o.gold || qty;
      G.player.addGold(g);
      await c.say(`Found ${g} gold!`);
    } else if (o.item) {
      const it = G.items[o.item];
      c.give(o.item, qty, true);
      G.sfx.play('coin');
      await c.say(`Found ${qty > 1 ? qty + '× ' : ''}${it ? it.name : o.item}!`);
    }
    G.save();
  }
  async function pickup(o) {
    const fl = flagOf(o);
    if (G.state.flags[fl] || o.gone) return;
    o.gone = true;
    G.state.flags[fl] = true;
    for (let i = 0; i < 8; i++) spawn(o.x * TS + 8, o.y * TS + 8, U.rand(-30, 30), U.rand(-50, -10), 0.5, '#fff6b0', 60, 1);
    await runScript(async (c) => grant(c, o));
  }

  // ------------------------------------------------------------------ trainers
  function trainerSees(n) {
    const tr = n.trainer;
    if (!tr || !n.visible || n.moving || n.engaged || (tr.flag && G.state.flags[tr.flag])) return 0;
    const p = S.player, sight = tr.sight != null ? tr.sight : 4;
    let x = n.x, y = n.y;
    for (let i = 1; i <= sight; i++) {
      x += DX[n.dir]; y += DY[n.dir];
      if (p.x === x && p.y === y) return i;
      if (tileSolid(x, y) || npcAt(x, y) || (objAt(x, y) && objAt(x, y).type === 'chest')) return 0;
    }
    return 0;
  }
  function checkTrainers() {
    for (let i = 0; i < S.npcs.length; i++) {
      const n = S.npcs[i];
      if (!n.trainer) continue;
      const d = trainerSees(n);
      if (d) { spotted(n, d); return true; }
      if (n.engaged && n.engagedCooldown && !inLine(n)) { n.engaged = false; n.engagedCooldown = false; }
    }
    return false;
  }
  function inLine(n) {
    const p = S.player;
    const dx = p.x - n.x, dy = p.y - n.y;
    const sight = n.trainer.sight != null ? n.trainer.sight : 4;
    return (dx === 0 && Math.sign(dy) === DY[n.dir] && Math.abs(dy) <= sight) || (dy === 0 && Math.sign(dx) === DX[n.dir] && Math.abs(dx) <= sight);
  }
  async function spotted(n, dist) {
    n.engaged = true;
    S.lock++;
    try {
      G.sfx.play('alert');
      n.bubble = 0.001;
      await U.sleep(750);
      n.bubble = 0;
      for (let i = 1; i < dist; i++) await moveAwait(n, n.dir, SCRIPT_SPEED);
      S.player.dir = OPP[n.dir]; G.state.dir = S.player.dir;
      await trainerBattle(n);
    } catch (e) { console.error('world: trainer error', e); }
    finally { S.lock = Math.max(0, S.lock - 1); W.refresh(); }
  }
  async function trainerBattle(n) {
    const tr = n.trainer;
    const c = G.cmd;
    const who = { name: n.name, look: n.look };
    const b = tr.battle || { type: 'sword', opts: {} };
    const type = b.type || 'sword';
    const opts = Object.assign({ title: n.name || 'Challenger' }, b.opts || {});
    n.engaged = true;
    S.lock++;
    try {
      if (type === 'joust' && (!G.state.equip.lance || !G.state.equip.horse)) {
        await c.say(tr.needGear || 'Come back when you have a horse and a lance, squire!', who);
        n.engagedCooldown = true;
        return;
      }
      if (tr.intro) await c.say(tr.intro, who);
      const res = (await G.battle.start(type, opts)) || { won: false };
      if (type === 'sword' && res.hp != null && !res.fled) G.player.setHp(res.hp);
      if (res.won && !res.fled) {
        if (tr.flag) c.setFlag(tr.flag);
        if (tr.win) await c.say(tr.win, who);
        if (tr.xp || tr.gold) {
          if (tr.xp) c.xp(tr.xp);
          if (tr.gold) c.gold(tr.gold);
        } else {
          const ids = type === 'sword' ? opts.enemies || [] : type === 'joust' ? [opts.opponent] : opts.rivals || [];
          c.reward(type, ids.filter(Boolean));
        }
        G.save();
        n.engagedCooldown = true;
      } else {
        if (tr.lose) await c.say(tr.lose, who);
        n.engagedCooldown = true;
        if (type === 'sword') {
          if (opts.noDeath) G.player.setHp(Math.max(1, res.hp || 1));
          else await G.game.blackout();
        }
      }
    } catch (e) { console.error('world: trainer battle error', e); }
    finally { S.lock = Math.max(0, S.lock - 1); }
  }

  // ------------------------------------------------------------------ wild encounters
  function rollEncounter() {
    const m = S.map;
    if (!m.encounters || !m.encounters.length) return false;
    if (S.noEnc > 0) return false;
    const rate = m.encounterRate != null ? m.encounterRate : 0.1;
    if (!U.chance(rate)) return false;
    const pick = U.weighted(m.encounters);
    if (!pick || !pick.enemies || !pick.enemies.length) return false;
    wildBattle(pick.enemies.slice());
    return true;
  }
  function wildTitle(enemies) {
    const name = (id) => (G.roster.sword[id] && G.roster.sword[id].name) || id.replace(/_/g, ' ');
    const first = name(enemies[0]);
    if (enemies.length === 1) return `A wild ${first} appears!`;
    const plural = (n) => (/(wolf)$/i.test(n) ? n.replace(/f$/i, 'ves') : /[sxz]$|ch$|sh$/i.test(n) ? n + 'es' : /[^aeiou]y$/i.test(n) ? n.slice(0, -1) + 'ies' : n + 's');
    if (enemies.every((e) => e === enemies[0])) return `${enemies.length} ${plural(first)} attack!`;
    return `${first} and company attack!`;
  }
  async function wildBattle(enemies) {
    const st = S;
    st.lock++;
    try {
      st.player.bubble = 0.001;
      G.sfx.play('alert');
      await U.sleep(550);
      st.player.bubble = 0;
      const res = (await G.battle.start('sword', { enemies, arena: st.map.arena || 'field', canFlee: true, title: wildTitle(enemies) })) || { won: false };
      st.noEnc = 4;
      if (res.fled) { if (res.hp != null) G.player.setHp(res.hp); }
      else if (res.won) {
        if (res.hp != null) G.player.setHp(res.hp);
        G.cmd.reward('sword', enemies);
        G.save();
      } else {
        await G.game.blackout();
      }
    } catch (e) { console.error('world: encounter error', e); }
    finally { st.lock = Math.max(0, st.lock - 1); if (S === st) W.refresh(); }
  }

  // ------------------------------------------------------------------ player movement
  // Touch: start running only after ~1.5 s of continuous full-tilt walking,
  // so short hops stay at walking pace. Keyboard: hold C/Shift.
  let tiltSince = -1, lastRunCheck = -1;
  function wantRun() {
    const s = G.input.stick;
    if (G.input.down('c')) return true;
    const now = G.time;
    if (!(s.active && s.mag > 0.9) || now - lastRunCheck > 0.45) tiltSince = now;
    lastRunCheck = now;
    return now - tiltSince > 1.5;
  }
  function tryStep(dir) {
    const p = S.player;
    p.dir = dir;
    const nx = p.x + DX[dir], ny = p.y + DY[dir];
    if (!inBounds(nx, ny)) {
      const ed = edgeFor(dir);
      if (ed) { S.walking = false; edgeWarp(ed, dir); return; }
      bump(); return;
    }
    if (blocked(nx, ny)) { bump(); return; }
    S.bumpT = 0;
    const run = wantRun();
    S.running = run;
    startMove(p, dir, run ? RUN_SPEED : WALK_SPEED);
    S.walking = true;
  }
  async function edgeWarp(ed, dir) {
    const st = S;
    st.lock++;
    try {
      await G.scenes.fade(() => { enterMap(ed.to, ed.x, ed.y, dir); G.save(); }, { ms: 200 });
    } finally { st.lock = Math.max(0, st.lock - 1); }
    await runOnEnter();
  }
  function bump() {
    const p = S.player;
    if (S.bumpT <= 0) {
      G.sfx.play('bump');
      S.bumpT = 0.38;
      p.parity ^= 1;
    }
    S.bumpAnim = 0.2;
  }
  function onPlayerArrive() {
    const p = S.player;
    G.state.x = p.x; G.state.y = p.y; G.state.dir = p.dir;
    G.state.steps = (G.state.steps || 0) + 1;
    if (S.noEnc > 0) S.noEnc--;
    if (!G.state.flags._hint_move && G.state.steps >= 6) { G.state.flags._hint_move = true; S.hintFade = 1; }
    if ((G.state.steps & 1) === 0) G.sfx.play('step');
    if (S.running && U.chance(0.5)) spawn(p.px + 8, p.py + 15, -DX[p.dir] * 15, -8, 0.35, 'rgba(220,200,160,0.8)', 0, 2);
    const ch = tileAt(p.x, p.y);
    if (G.tiles.defs[ch] && G.tiles.defs[ch].tallGrass) {
      rustle(p.x, p.y);
    }
    const o = objAt(p.x, p.y);
    if (o && o.type === 'item') { S.walking = false; pickup(o); return; }
    const w = warpAt(p.x, p.y);
    if (w) { S.walking = false; doWarp(w.to, w.tx, w.ty, w.dir); return; }
    if (checkTrainers()) { S.walking = false; return; }
    if (G.tiles.defs[ch] && G.tiles.defs[ch].tallGrass && rollEncounter()) { S.walking = false; }
  }
  function rustle(x, y) {
    G.sfx.play('bush');
    S.rustle.push({ x, y, t: 0 });
    if (S.rustle.length > 6) S.rustle.shift();
    for (let i = 0; i < 4; i++) spawn(x * TS + U.rand(3, 13), y * TS + U.rand(6, 12), U.rand(-25, 25), U.rand(-45, -20), U.rand(0.4, 0.7), i & 1 ? '#7ed65a' : '#2f8238', 120, 1);
  }

  function updatePlayer(dt) {
    const p = S.player;
    if (S.bumpT > 0) S.bumpT -= dt;
    if (S.bumpAnim > 0) S.bumpAnim -= dt;
    if (p.moving) {
      if (updateEnt(p, dt)) {
        if (!p.scripted) onPlayerArrive();
      } else return;
    }
    if (p.moving || locked()) { S.walking = false; return; }
    if (S.pendingTrainer) return;
    if (checkTrainers()) return;
    const d = G.input.dir4();
    if (!d) { S.walking = false; S.turnT = 0; return; }
    if (d !== p.dir && !S.walking) {
      p.dir = d; G.state.dir = d;
      S.turnT = 0.1;
      return;
    }
    if (S.turnT > 0) { S.turnT -= dt; if (S.turnT > 0) return; }
    tryStep(d);
  }

  // ------------------------------------------------------------------ NPC AI
  function updateNpcs(dt) {
    const frozen = S.lock > 0 || G.ui.busy();
    for (let i = 0; i < S.npcs.length; i++) {
      const n = S.npcs[i];
      if (!n.visible) continue;
      if (n.moving) { updateEnt(n, dt); continue; }
      if (n.bubble > 0) n.bubble += dt;
      if (frozen || n.scripted || n.engaged) continue;
      n.timer -= dt;
      if (n.timer > 0) continue;
      const mv = n.move || 'still';
      if (mv === 'turn') {
        n.dir = U.pick(DIR4);
        n.timer = U.rand(1.2, 3.5);
      } else if (mv === 'wander') {
        n.timer = U.rand(1.0, 3.2);
        const dir = U.pick(DIR4);
        const nx = n.x + DX[dir], ny = n.y + DY[dir];
        if (Math.abs(nx - n.home.x) <= 2 && Math.abs(ny - n.home.y) <= 2 && !blocked(nx, ny, n) && !warpAt(nx, ny)) startMove(n, dir, NPC_SPEED);
        else n.dir = dir;
      } else n.timer = 9999;
    }
  }

  // ------------------------------------------------------------------ camera
  function camTarget(out) {
    const p = S.player;
    const mw = S.w * TS, mh = S.h * TS;
    let cx = p.px + 8 - G.W / 2, cy = p.py + 8 - G.H / 2 - 4;
    if (mw <= G.W) cx = (mw - G.W) / 2; else cx = U.clamp(cx, 0, mw - G.W);
    if (mh <= G.H) cy = (mh - G.H) / 2; else cy = U.clamp(cy, 0, mh - G.H);
    out.x = cx; out.y = cy;
  }
  const tmpCam = { x: 0, y: 0 };
  function snapCamera() { camTarget(tmpCam); S.cam.x = tmpCam.x; S.cam.y = tmpCam.y; }
  function updateCamera(dt) {
    camTarget(tmpCam);
    const k = 1 - Math.exp(-dt * 14);
    S.cam.x += (tmpCam.x - S.cam.x) * k;
    S.cam.y += (tmpCam.y - S.cam.y) * k;
    if (Math.abs(tmpCam.x - S.cam.x) < 0.05) S.cam.x = tmpCam.x;
    if (Math.abs(tmpCam.y - S.cam.y) < 0.05) S.cam.y = tmpCam.y;
  }

  // ------------------------------------------------------------------ input (interact, taps, menu)
  function menuRect(r) {
    r.x = G.W - 30; r.y = 3; r.w = 28; r.h = 28;
    return r;
  }
  const mRect = { x: 0, y: 0, w: 0, h: 0 };
  function openMenu() {
    if (!G.menus || typeof G.menus.open !== 'function') { G.ui.toast('Menu coming soon'); return; }
    G.sfx.play('select');
    S.lock++;
    const st = S;
    let r;
    try { r = G.menus.open(); } catch (e) { console.error('world: menu error', e); }
    Promise.resolve(r).catch((e) => console.error('world: menu error', e)).finally(() => {
      st.lock = Math.max(0, st.lock - 1);
      if (S === st) W.refresh();
    });
  }
  function handleInput() {
    const inp = G.input;
    if (G.input.consumeTap(menuRect(mRect))) { if (!locked() && !S.player.moving) openMenu(); return; }
    if (locked() || S.player.moving) return;
    if (inp.pressed('menu')) { openMenu(); return; }
    // tap directly on an adjacent NPC / sign / chest
    const evs = inp.events;
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      if (e.type !== 'tap') continue;
      const wx = e.x + S.camX, wy = e.y + S.camY;
      const hit = tapTarget(wx, wy);
      if (hit) {
        inp.consumeTap({ x: e.x - 0.5, y: e.y - 0.5, w: 1, h: 1 });
        const p = S.player;
        const dx = hit.x - p.x, dy = hit.y - p.y;
        p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        G.state.dir = p.dir;
        interactAt(hit.x, hit.y);
        return;
      }
    }
    if (inp.pressed('a')) {
      const f = facedTile();
      interactAt(f.x, f.y);
    }
  }
  const tapHit = { x: 0, y: 0 };
  function tapTarget(wx, wy) {
    const p = S.player;
    // NPC sprite bounds (taller than a tile)
    for (let i = 0; i < S.npcs.length; i++) {
      const n = S.npcs[i];
      if (!n.visible) continue;
      if (wx >= n.px - 2 && wx < n.px + 18 && wy >= n.py - 8 && wy < n.py + 17) {
        const d = Math.abs(n.x - p.x) + Math.abs(n.y - p.y);
        const across = d === 2 && (n.x === p.x || n.y === p.y) && G.tiles.defs[tileAt((n.x + p.x) / 2, (n.y + p.y) / 2)] && G.tiles.defs[tileAt((n.x + p.x) / 2, (n.y + p.y) / 2)].counter;
        if (d === 1) { tapHit.x = n.x; tapHit.y = n.y; return tapHit; }
        if (across) { tapHit.x = (n.x + p.x) / 2; tapHit.y = (n.y + p.y) / 2; return tapHit; }
      }
    }
    const tx = Math.floor(wx / TS), ty = Math.floor(wy / TS);
    if (Math.abs(tx - p.x) + Math.abs(ty - p.y) === 1 && (signAt(tx, ty) || tileAt(tx, ty) === 'S' || (objAt(tx, ty) && objAt(tx, ty).type === 'chest'))) {
      tapHit.x = tx; tapHit.y = ty; return tapHit;
    }
    return null;
  }

  // ------------------------------------------------------------------ scene
  function makeScene() {
    return {
      name: 'world',
      update(dt) {
        if (!S) return;
        S.t += dt;
        handleInput();
        updatePlayer(dt);
        updateNpcs(dt);
        for (let i = 0; i < S.objects.length; i++) if (S.objects[i].bounce > 0) S.objects[i].bounce = Math.max(0, S.objects[i].bounce - dt * 3);
        for (let i = S.rustle.length - 1; i >= 0; i--) { S.rustle[i].t += dt; if (S.rustle[i].t > 0.35) S.rustle.splice(i, 1); }
        for (let i = 0; i < PN; i++) {
          const q = parts[i];
          if (!q.on) continue;
          q.life -= dt;
          if (q.life <= 0) { q.on = false; continue; }
          q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
        }
        if (S.shakeT > 0) S.shakeT -= dt;
        if (S.banner) { S.banner.t += dt; if (S.banner.t > 3) S.banner = null; }
        if (S.hintFade > 0 && G.state.flags._hint_move) S.hintFade = Math.max(0, S.hintFade - dt * 0.7);
        updateCamera(dt);
      },
      draw(ctx) { if (S) drawWorld(ctx); },
      resize() { if (S) snapCamera(); },
      resume() { if (S) W.refresh(); },
    };
  }

  // ------------------------------------------------------------------ drawing
  const dl = []; // y-sorted draw list (reused)
  function drawEnt(ctx, e, camX, camY, q) {
    const sx = Math.round((e.px + 8 - camX) * q) / q, sy = Math.round((e.py + 16 - camY) * q) / q;
    let f = entFrame(e);
    if (e === S.player && !e.moving && S.bumpAnim > 0) f = e.parity ? 1 : 2;
    const c = charFrame(e, e.dir, f);
    ctx.drawImage(getShadow(), sx - 7, sy - 3.5);
    const w = c.width, h = c.height;
    ctx.drawImage(c, sx - w / 2, sy - h + 1 - (e.hop || 0));
    // tall grass covers the feet
    const tx = e.moving ? (e.t / e.dur < 0.5 ? e.fx : e.x) : e.x;
    const ty = e.moving ? (e.t / e.dur < 0.5 ? e.fy : e.y) : e.y;
    if (inBounds(tx, ty) && S.rows[ty][tx] === ',') {
      let jig = 0;
      for (let i = 0; i < S.rustle.length; i++) if (S.rustle[i].x === tx && S.rustle[i].y === ty) jig = Math.sin(S.rustle[i].t * 40) > 0 ? 1 : -1;
      ctx.drawImage(G.tiles.grassFront(), Math.round((tx * TS - camX) * q) / q + jig, Math.round((ty * TS - camY) * q) / q);
    }
  }
  function drawWorld(ctx) {
    const q = G.gfx.scale * G.gfx.dpr;
    let camX = S.cam.x, camY = S.cam.y;
    if (S.shakeT > 0) { camX += U.rand(-2, 2); camY += U.rand(-2, 2); }
    camX = Math.round(camX * q) / q; camY = Math.round(camY * q) / q;
    S.camX = camX; S.camY = camY;
    const mw = S.w * TS, mh = S.h * TS;
    if (camX < 0 || camY < 0 || camX + G.W > mw || camY + G.H > mh) {
      if (S.map.outdoor === false) { ctx.fillStyle = '#0b0806'; ctx.fillRect(0, 0, G.W, G.H); }
      else {
        // outdoor maps smaller than the view sit in a dense forest
        const pat = forestPattern(ctx);
        const ox = ((-camX % 32) + 32) % 32 - 32, oy = ((-camY % 32) + 32) % 32 - 32;
        ctx.save(); ctx.translate(ox, oy); ctx.fillStyle = pat; ctx.fillRect(0, 0, G.W + 64, G.H + 64); ctx.restore();
      }
    }
    G.tiles.drawMap(ctx, S.mapGfx, camX, camY, G.W, G.H, S.t);
    // rustling grass tiles redraw with a jiggle
    for (let i = 0; i < S.rustle.length; i++) {
      const r = S.rustle[i];
      const off = Math.sin(r.t * 50) * (1 - r.t / 0.35) * 1.5;
      ctx.drawImage(G.tiles.grassFull(), r.x * TS - camX + off, r.y * TS - camY);
    }
    // ground objects
    const sp = getSparkles();
    for (let i = 0; i < S.objects.length; i++) {
      const o = S.objects[i];
      const sx = o.x * TS - camX, sy = o.y * TS - camY;
      if (sx < -TS || sy < -TS || sx > G.W || sy > G.H) continue;
      if (o.type === 'chest') {
        const open = !!G.state.flags[flagOf(o)];
        ctx.drawImage(getChest(open), sx, sy - Math.sin(o.bounce * Math.PI) * 3);
      } else if (o.type === 'item' && !o.gone && !G.state.flags[flagOf(o)]) {
        const f = Math.floor(S.t * 4 + o.x) % 3;
        ctx.drawImage(sp[f], sx, sy + (Math.sin(S.t * 3 + o.x) > 0 ? 0 : -1));
      }
    }
    // entities, y-sorted
    dl.length = 0;
    dl.push(S.player);
    for (let i = 0; i < S.npcs.length; i++) if (S.npcs[i].visible) dl.push(S.npcs[i]);
    for (let i = 1; i < dl.length; i++) {
      const e = dl[i];
      let j = i - 1;
      while (j >= 0 && dl[j].py > e.py) { dl[j + 1] = dl[j]; j--; }
      dl[j + 1] = e;
    }
    for (let i = 0; i < dl.length; i++) {
      const e = dl[i];
      if (e.px - camX < -24 || e.px - camX > G.W + 8 || e.py - camY < -8 || e.py - camY > G.H + 24) continue;
      drawEnt(ctx, e, camX, camY, q);
    }
    // bubbles
    for (let i = 0; i < dl.length; i++) {
      const e = dl[i];
      if (!(e.bubble > 0)) continue;
      const k = Math.min(1, e.bubble / 0.15);
      const s = U.ease.outBack(k);
      const b = getBubble();
      const bw = 13 * s, bh = 15 * s;
      ctx.drawImage(b, e.px + 8 - camX - bw / 2, e.py - 8 - camY - bh + 15 * (1 - s) * 0.5, bw, bh);
    }
    for (let i = 0; i < PN; i++) {
      const p = parts[i];
      if (!p.on) continue;
      ctx.globalAlpha = Math.min(1, (p.life / p.max) * 2);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - camX, p.y - camY, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    drawHud(ctx);
  }

  // ------------------------------------------------------------------ HUD
  const hud = { hp: -1, max: -1, gold: -1, lvl: -1, armor: null, goldStr: '', lvlStr: '' };
  function refreshHud() {
    const s = G.state;
    if (hud.hp !== s.hp || hud.lvl !== s.level || hud.armor !== s.equip.armor || hud.gold !== s.gold) {
      hud.hp = s.hp; hud.lvl = s.level; hud.armor = s.equip.armor; hud.gold = s.gold;
      hud.max = G.player.maxHp();
      hud.goldStr = String(s.gold);
      hud.lvlStr = 'Lv' + s.level;
    }
  }
  function drawHud(ctx) {
    const D = G.draw;
    refreshHud();
    // stat plate
    const x = 4, y = 4, w = 92, h = 26;
    D.rrect(x + 1, y + 2, w, h, 4, 'rgba(0,0,0,0.3)');
    D.rrect(x, y, w, h, 4, 'rgba(43,29,20,0.82)', '#c9893c', 1);
    D.text(hud.lvlStr, x + 5, y + 4, { size: 7, color: '#ffe48a', bold: true });
    D.text('HP', x + 26, y + 4, { size: 7, color: '#ffb0a0', bold: true });
    const frac = hud.max > 0 ? hud.hp / hud.max : 0;
    D.bar(x + 39, y + 5, 47, 5, frac, frac > 0.5 ? '#5bd04a' : frac > 0.2 ? '#f2c14e' : '#e0473c');
    // coin
    D.circle(x + 9, y + 18.5, 3.5, '#f2c14e', '#8a6a1a', 1);
    ctx.fillStyle = '#fff4b0'; ctx.fillRect(x + 7.5, y + 16.5, 1.2, 1.2);
    D.text(hud.goldStr, x + 16, y + 14.5, { size: 7, color: '#fff3d6', bold: true });
    D.text(hud.hp + '/' + hud.max, x + w - 6, y + 14.5, { size: 6, color: '#e8d8c0', align: 'right' });
    // menu button
    const r = menuRect(mRect);
    const pressed = G.input.pointerIn(r);
    const bx = r.x + 2, by = r.y + 1 + (pressed ? 1 : 0), bs = 24;
    D.rrect(bx, r.y + 3, bs, bs, 5, 'rgba(0,0,0,0.35)');
    D.rrect(bx, by, bs, bs, 5, 'rgba(43,29,20,0.82)', '#c9893c', 1);
    ctx.fillStyle = '#ffe9b8';
    for (let i = 0; i < 3; i++) ctx.fillRect(bx + 6, by + 7 + i * 4.5, 12, 2);
    // location banner
    if (S.banner) {
      const t = S.banner.t;
      const k = t < 0.35 ? U.ease.outCubic(t / 0.35) : t > 2.5 ? 1 - U.ease.inQuad((t - 2.5) / 0.5) : 1;
      const bw = Math.min(G.W - 24, Math.max(110, D.measure(S.banner.text, 10) + 30));
      const bxx = Math.round((G.W - bw) / 2), byy = Math.round(36 - 50 * (1 - k));
      D.rrect(bxx + 1, byy + 2, bw, 22, 3, 'rgba(0,0,0,0.35)');
      D.rrect(bxx, byy, bw, 22, 3, '#a8703e', '#2b1d14', 1.5);
      D.rrect(bxx + 2, byy + 2, bw - 4, 18, 2, '#c98a52', '#7e4d28', 1);
      ctx.fillStyle = '#7e4d28';
      ctx.fillRect(bxx + 5, byy + 5, 2, 2); ctx.fillRect(bxx + bw - 7, byy + 5, 2, 2);
      ctx.fillRect(bxx + 5, byy + 15, 2, 2); ctx.fillRect(bxx + bw - 7, byy + 15, 2, 2);
      D.text(S.banner.text, G.W / 2, byy + 11.5, { size: 10, align: 'center', baseline: 'middle', color: '#fff6dc', shadow: 'rgba(60,30,10,0.8)', bold: true });
    }
    // first-time hint
    if (!G.state.flags._hint_move || S.hintFade > 0) {
      if (S.lock > 0 || G.ui.busy()) S.hintShow = 0;
      else S.hintShow = Math.min(1, (S.hintShow || 0) + 1 / 30);
      const a = (G.state.flags._hint_move ? S.hintFade : 1) * S.hintShow;
      if (a > 0.01) {
        ctx.globalAlpha = a;
        const msg = 'Left thumb: move • Tap right: talk/interact • ☰ menu';
        const tw = Math.min(G.W - 16, D.measure(msg, 7) + 16);
        const lines = tw < D.measure(msg, 7) + 16 ? 2 : 1;
        const hh = lines === 2 ? 26 : 16;
        const hy = G.H - hh - 8;
        D.rrect(G.W / 2 - tw / 2, hy, tw, hh, 6, 'rgba(25,15,8,0.72)', 'rgba(255,228,138,0.6)', 1);
        if (lines === 1) D.text(msg, G.W / 2, hy + 8.5, { size: 7, align: 'center', baseline: 'middle', color: '#fff3d6' });
        else {
          D.text('Left thumb: move • Tap right: talk', G.W / 2, hy + 8, { size: 7, align: 'center', baseline: 'middle', color: '#fff3d6' });
          D.text('☰ opens the menu', G.W / 2, hy + 18, { size: 7, align: 'center', baseline: 'middle', color: '#fff3d6' });
        }
        ctx.globalAlpha = 1;
      }
    }
    if (G.DEBUG) {
      const p = S.player;
      D.text(`${S.map.id} ${p.x},${p.y} ${tileAt(p.x, p.y)}`, 4, y + h + 4, { size: 7, color: '#0f0', shadow: true });
    }
    G.input.drawStick(ctx);
  }

  // ------------------------------------------------------------------ validation
  function validate(map) {
    const out = [];
    if (!map || !Array.isArray(map.tiles) || !map.tiles.length) return ['map has no tiles'];
    const rows = map.tiles, h = rows.length, w = rows[0].length;
    const id = map.id || '?';
    rows.forEach((r, y) => {
      if (typeof r !== 'string') { out.push(`${id}: row ${y} is not a string`); return; }
      if (r.length !== w) out.push(`${id}: row ${y} has length ${r.length}, expected ${w}`);
      for (let x = 0; x < r.length; x++) if (!G.tiles.known(r[x])) out.push(`${id}: unknown tile '${r[x]}' at ${x},${y}`);
    });
    const ch = (x, y) => (y >= 0 && y < h && x >= 0 && x < (rows[y] || '').length ? rows[y][x] : null);
    const oob = (x, y) => ch(x, y) == null;
    const solidAt = (x, y) => { const c = ch(x, y); return c != null && G.tiles.solid(c); };
    for (const wp of map.warps || []) {
      if (oob(wp.x, wp.y)) out.push(`${id}: warp at ${wp.x},${wp.y} is out of bounds`);
      else if (solidAt(wp.x, wp.y)) out.push(`${id}: warp at ${wp.x},${wp.y} is on solid '${ch(wp.x, wp.y)}'`);
      const tm = G.maps[wp.to];
      if (!tm) out.push(`${id}: warp at ${wp.x},${wp.y} targets missing map '${wp.to}'`);
      else if (Array.isArray(tm.tiles)) {
        const tc = tm.tiles[wp.ty] && tm.tiles[wp.ty][wp.tx];
        if (tc == null) out.push(`${id}: warp at ${wp.x},${wp.y} → ${wp.to} ${wp.tx},${wp.ty} is out of bounds`);
        else if (G.tiles.solid(tc)) out.push(`${id}: warp at ${wp.x},${wp.y} → ${wp.to} ${wp.tx},${wp.ty} lands on solid '${tc}'`);
      }
    }
    const ids = {};
    for (const n of map.npcs || []) {
      if (n.id) { if (ids[n.id]) out.push(`${id}: duplicate npc id '${n.id}'`); ids[n.id] = 1; }
      if (oob(n.x, n.y)) out.push(`${id}: npc '${n.id}' at ${n.x},${n.y} is out of bounds`);
      else if (solidAt(n.x, n.y) && !'dg'.includes(ch(n.x, n.y))) out.push(`${id}: npc '${n.id}' at ${n.x},${n.y} is on solid '${ch(n.x, n.y)}'`);
      if (n.trainer && n.trainer.battle && !['sword', 'joust', 'archery'].includes(n.trainer.battle.type)) out.push(`${id}: trainer '${n.id}' has unknown battle type`);
    }
    for (const o of map.objects || []) {
      if (oob(o.x, o.y)) out.push(`${id}: object '${o.id}' at ${o.x},${o.y} is out of bounds`);
      else if (solidAt(o.x, o.y)) out.push(`${id}: object '${o.id}' at ${o.x},${o.y} is on solid '${ch(o.x, o.y)}'`);
      if (o.item && o.item !== 'gold' && G.items && !G.items[o.item]) out.push(`${id}: object '${o.id}' gives unknown item '${o.item}'`);
    }
    for (const s of map.signs || []) if (oob(s.x, s.y)) out.push(`${id}: sign at ${s.x},${s.y} is out of bounds`);
    for (const side of ['north', 'south', 'east', 'west']) {
      const e = map.edges && map.edges[side];
      if (e && !G.maps[e.to]) out.push(`${id}: ${side} edge targets missing map '${e.to}'`);
    }
    if (map.encounters && Object.keys(G.roster.sword).length) {
      for (const enc of map.encounters) for (const en of enc.enemies || []) if (!G.roster.sword[en]) out.push(`${id}: encounter enemy '${en}' not in sword roster`);
    }
    return out;
  }

  // ------------------------------------------------------------------ commands (G.cmd)
  function findNpc(id) {
    if (!S) return null;
    for (let i = 0; i < S.npcs.length; i++) if (S.npcs[i].id === id) return S.npcs[i];
    return null;
  }
  async function walkEnt(e, path, speed) {
    e.scripted = (e.scripted || 0) + 1;
    try {
      for (const ch of String(path || '')) {
        const d = PATHDIR[ch];
        if (!d) continue;
        while (e.moving) await U.sleep(16);
        await moveAwait(e, d, speed);
      }
    } finally { e.scripted--; }
  }
  const worldCmds = {
    warp: (mapId, x, y, dir) => doWarp(mapId, x, y, dir),
    async walkPlayer(path) {
      if (!S) return;
      const p = S.player;
      await walkEnt(p, path, SCRIPT_SPEED);
      G.state.x = p.x; G.state.y = p.y; G.state.dir = p.dir;
    },
    async walkNpc(id, path) {
      const n = findNpc(id);
      if (!n) { console.warn('world: walkNpc unknown npc', id); return; }
      await walkEnt(n, path, SCRIPT_SPEED);
    },
    faceNpc(id, dir) {
      const n = findNpc(id);
      if (!n) return;
      if (dir === 'player' && S) { const p = S.player; const dx = p.x - n.x, dy = p.y - n.y; dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
      if (DX[dir] != null) n.dir = dir;
    },
    facePlayer(dir) {
      if (!S) return;
      const p = S.player;
      const n = findNpc(dir);
      if (n) { const dx = n.x - p.x, dy = n.y - p.y; dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
      if (DX[dir] != null) { p.dir = dir; G.state.dir = dir; }
    },
    showNpc(id, on = true) {
      hiddenOverride[id] = !!on;
      W.refresh();
    },
    shake(ms = 400) {
      if (S) S.shakeT = ms / 1000;
      G.sfx.play('thud');
      return U.sleep(ms);
    },
    npc: (id) => findNpc(id),
    emote(id, ms = 700) { // "!" bubble over an npc (or 'player')
      const e = id === 'player' ? S && S.player : findNpc(id);
      if (!e) return Promise.resolve();
      e.bubble = 0.001; G.sfx.play('alert');
      return U.sleep(ms).then(() => { e.bubble = 0; });
    },
  };
  function installCmds() { if (G.cmd) Object.assign(G.cmd, worldCmds); }
  installCmds();

  // ------------------------------------------------------------------ public API
  W.refresh = () => {
    if (!S) return;
    for (let i = 0; i < S.npcs.length; i++) {
      const n = S.npcs[i];
      const ov = hiddenOverride[n.id];

    px(C.outline, 3, 2, 10, 14);
    px('#2a1810', 4, 3, 8, 13);
    px('#4a2c1a', 4, 3, 8, 2);
    px(C.wainsD, 2, 2, 1, 14); px(C.wainsD, 13, 2, 1, 14);
  }

  function castleWall(noBattlement) {
    const up = at(0, -1);
    px(C.stoneD, 0, 0, T, T);
    // big blocks 8x5, staggered
    for (let r = 0; r < 4; r++) {
      const y = r * 4;
      const off = (r + cell.ty * 4) & 1 ? 4 : 0;
      for (let x = -off; x < T; x += 8) {
        px(C.stone, x + 1, y, 6, 3);
        px(C.stoneL, x + 1, y, 6, 1);
        px(C.stoneDD, x, y + 3, 8, 1);
      }
    }
    if (cell.v === 2 && at(0, 1) === 'c' && up === 'c') { // arrow slit
      px(C.stoneDD, 7, 4, 2, 8); px('#1a1418', 7, 5, 2, 6); px(C.stoneL, 6, 4, 1, 8);
    }
    if (!noBattlement && !inSet(CASTLE + '*', up) && !(up === '"' && !cell.outdoor)) {
      // merlons and crenels
      px(C.stoneDD, 0, 0, T, 5);
      const m = (cell.tx & 1) ? [[1, 6]] : [[1, 6], [9, 6]];
      void m;
      for (const mx of [1, 9]) {
        px(C.outline, mx - 1, 0, 8, 5);
        px(C.stone, mx, 0, 6, 4); px(C.stoneL, mx, 0, 6, 1); px(C.stoneD, mx + 5, 1, 1, 3);
      }
      px(C.outline, 0, 4, T, 1);
    }
    const lf = at(-1, 0), rt = at(1, 0);
    if (!inSet(CASTLEISH, lf)) { px(C.stoneDD, 0, 0, 1, T); px(C.stoneL, 1, 0, 1, T); }
    if (!inSet(CASTLEISH, rt)) px(C.outline, 15, 0, 1, T);
    if (!inSet(CASTLEISH, at(0, 1))) px(C.stoneDD, 0, 14, T, 2);
  }
  function battlement() {
    const up = inSet(CASTLE, at(0, -1)), dnCh = at(0, 1), dn = inSet(CASTLE, dnCh);
    const lf = inSet(CASTLE + '*', at(-1, 0)), rt = inSet(CASTLE + '*', at(1, 0));
    if (!up && (dnCh === 'c' || dnCh === 'g' || dnCh === '*')) {
      // front-facing crenellated top: merlons with shadowed crenels
      paintGround(cell.g, cell.v);
      px('#4c4a56', 0, 4, T, 6);                     // walkway shadow seen through crenels
      px(C.stoneD, 0, 9, T, 7);
      for (let x = (cell.ty & 1) * 4; x < T; x += 8) px(C.stoneDD, x, 12, 1, 4);
      px(C.stoneDD, 0, 11, T, 1);
      px(C.stoneL, 0, 9, T, 1);
      for (const mx of [1, 9]) {
        px(C.outline, mx - 1, 0, 8, 10);
        px(C.stone, mx, 1, 6, 9); px(C.stoneL, mx, 1, 6, 2); px(C.stoneD, mx + 5, 3, 1, 7);
        px(C.stoneD, mx, 6, 5, 1);
      }
      if (!lf) { px(C.outline, 0, 0, 1, T); }
      if (!rt) { px(C.outline, 15, 0, 1, T); }
      return;
    }
    // walkway flagstones (thick wall seen from above)
    px(C.stoneD, 0, 0, T, T);
    for (const [x, y] of [[0, 0], [8, 0], [0, 8], [8, 8]]) { px(C.stone, x + 1, y + 1, 7, 7); px(C.stoneL, x + 1, y + 1, 7, 1); }
    const merlonRow = (y) => {
      px(C.outline, 0, y, T, 6);
      for (const mx of [0, 8]) { px(C.stone, mx + 1, y, 6, 5); px(C.stoneL, mx + 1, y, 6, 1); px(C.stoneD, mx + 6, y + 1, 1, 4); }
      px(C.stoneDD, 0, y + 5, T, 1);
    };
    const merlonCol = (x) => {
      px(C.outline, x, 0, 5, T);
      for (const my of [0, 8]) { px(C.stone, x, my + 1, 4, 6); px(C.stoneL, x, my + 1, 4, 1); }
    };
    if (!up) merlonRow(0);
    if (!dn) merlonRow(10);
    if (!lf) merlonCol(0);
    if (!rt) merlonCol(11);
  }

  function gate() {
    const lf = at(-1, 0) === 'g', rt = at(1, 0) === 'g';
    castleWall(true);
    // arch: ellipse centered on the gate opening (spans a run of g tiles)
    let run0 = 0, run1 = 0;
    while (at(run0 - 1, 0) === 'g' && run0 > -4) run0--;
    while (at(run1 + 1, 0) === 'g' && run1 < 4) run1++;
    const cx = ((run0 + run1 + 1) * 16) / 2;          // in local px
    const rx = ((run1 - run0 + 1) * 16) / 2 - 2.5, ry = 6;
    const cy = 7;
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      const inside = Math.abs(x + 0.5 - cx) <= rx && (y >= cy || dx * dx + dy * dy <= 1);
      const dx2 = (x + 0.5 - cx) / (rx + 2.5), dy2 = (y + 0.5 - cy) / (ry + 2.5);
      const ring = !inside && (Math.abs(x + 0.5 - cx) <= rx + 2.5) && (y >= cy ? false : dx2 * dx2 + dy2 * dy2 <= 1);
      if (inside) px(y < 9 ? '#1a1418' : '#241a20', x, y);
      else if (ring) px(((x + y) % 4 === 0) ? C.stoneDD : C.stoneL, x, y);
      else if (y >= cy && Math.abs(x + 0.5 - cx) <= rx + 2.5) px(((y % 4) === 0) ? C.stoneDD : C.stoneL, x, y); // jambs
    }
    // raised portcullis teeth
    for (let x = 1; x < T; x += 3) {
      if (Math.abs(x + 0.5 - cx) > rx - 1) continue;
      px('#6a6874', x, 3, 1, 5); px('#9a98a2', x, 8, 1, 1);
    }
    for (let x = 0; x < T; x++) if (Math.abs(x + 0.5 - cx) <= rx - 1) px('#6a6874', x, 5, 1, 1);
    // floor visible through the gate
    for (let x = 0; x < T; x++) if (Math.abs(x + 0.5 - cx) <= rx) { px(C.cobD, x, 13, 1, 3); if ((x + 1) % 4 < 2) px(C.cob, x, 14, 1, 1); }
    void lf; void rt;
  }

  function stoneWall() {
    const up = at(0, -1) === 'w';
    px(C.mortar, 0, 0, T, T);
    seed(7000 + cell.v);
    // irregular fieldstones
    let y = up ? 0 : 4;
    while (y < T) {
      const hgt = ri(3, 5);
      let x = -ri(0, 3);
      while (x < T) {
        const w = ri(4, 7);
        const col = rnd() < 0.35 ? C.rockD : C.rock;
        px(col, x + 1, y + 1, w - 1, hgt - 1);
        px(C.rockL, x + 1, y + 1, w - 2, 1);
        x += w;
      }
      y += hgt;
    }
    if (!up) { px(C.rockDD, 0, 0, T, 5); px(C.stoneL, 0, 0, T, 3); px(C.stone, 0, 3, T, 1); for (let x = 3; x < T; x += 5) px(C.stoneD, x, 0, 1, 3); }
    if (at(0, 1) !== 'w') px(C.rockDD, 0, 15, T, 1);
    // wall-mounted torches/banners and doors continue the wall: no edge seam beside them
    if (!inSet('wd*p', at(-1, 0))) px(C.rockDD, 0, 0, 1, T);
    if (!inSet('wd*p', at(1, 0))) px(C.rockDD, 15, 0, 1, T);
  }

  // ------------------------------------------------------------------ interiors
  function interiorWall() {
    const dn = at(0, 1), dn2 = at(0, 2), up = at(0, -1);
    const wallBelow = inSet('nW#l*', dn) || dn === '"';
    if (!wallBelow || dn === 'l') {
      // lower face: wallpaper top half + wainscot
      px(C.iwall, 0, 0, T, 7);
      for (let x = 1; x < T; x += 4) px(C.iwallS, x, 0, 2, 7);
      px(C.wainsD, 0, 7, T, 1); px(C.wainsL, 0, 8, T, 1);
      px(C.wains, 0, 9, T, 5);
      px(C.wainsD, 3, 10, 1, 3); px(C.wainsD, 11, 10, 1, 3);
      px(C.wainsL, 4, 10, 1, 3); px(C.wainsL, 12, 10, 1, 3);
      px(C.wainsD, 0, 14, T, 2);
      if (inSet('nW*', up)) return;
      px(C.timberD, 0, 0, T, 2);
      return;
    }
    if (!(inSet('nW#*', dn2) || dn2 === '"') || at(0, 2) === 'l') {
      // upper face: wallpaper with stripes, top molding when exposed
      px(C.iwall, 0, 0, T, T);
      for (let x = 1; x < T; x += 4) px(C.iwallS, x, 0, 2, T);
      if (!inSet('nW*', up)) { px(C.timberD, 0, 0, T, 3); px(C.timber, 0, 1, T, 1); }
      return;
    }
    // wall top (thickness, seen from above)
    px('#5e3a22', 0, 0, T, T);
    px('#7a4e2e', 1, 1, 14, 14);
    px('#6a4428', 0, 7, T, 1);
  }
  function counter() {
    const lf = at(-1, 0) === 'v', rt = at(1, 0) === 'v', up = at(0, -1) === 'v', dn = at(0, 1) === 'v';
    const top = up ? 0 : 2;
    px(C.outline, lf ? 0 : 1, top, (rt ? 16 : 15) - (lf ? 0 : 1), (dn ? 16 : 14) - top);
    px(C.woodL, lf ? 0 : 2, top + 1, (rt ? 16 : 14) - (lf ? 0 : 2), (dn ? 15 : 9) - top);
    px('#e8b47a', lf ? 0 : 2, top + 1, (rt ? 16 : 14) - (lf ? 0 : 2), 1);
    if (!dn) {
      px(C.wood, lf ? 0 : 2, 10, (rt ? 16 : 14) - (lf ? 0 : 2), 3);
      px(C.woodD, lf ? 0 : 2, 12, (rt ? 16 : 14) - (lf ? 0 : 2), 1);
      if (!lf) px(C.woodD, 2, 10, 1, 3);
      if (!rt) px(C.woodD, 13, 10, 1, 3);
    }
    if (cell.v === 1) { px('#e8e0d0', 5, 4, 4, 3); px('#c8a050', 6, 5, 2, 1); } // mug/plate
    if (cell.v === 4) { px('#f2c14e', 9, 5, 2, 2); px('#fff0a0', 9, 5, 1, 1); }  // coins
  }
  function bed(v) {
    px(C.outline, 1, 0, 14, 16);
    px(C.woodD, 2, 0, 12, 2);
    px('#f6f2ea', 3, 2, 10, 4); px('#dcd6ca', 3, 5, 10, 1);
    const q = ['#c84a4a', '#3f6fc4', '#4f9a4a'][v % 3];
    px(q, 2, 6, 12, 9); px(sh(q, 0.2), 2, 6, 12, 1);
    px(sh(q, -0.2), 4, 9, 8, 1); px(sh(q, -0.2), 4, 12, 8, 1); px(sh(q, -0.2), 7, 7, 2, 7);
    px(C.woodD, 2, 15, 12, 1);
  }
  function bookshelf(v) {
    px(C.outline, 0, 0, T, T);
    px(C.woodD, 1, 0, 14, 15);
    seed(8000 + v);
    const cols = ['#c84a4a', '#3f6fc4', '#4f9a4a', '#e0a030', '#7b3fb5', '#e8e0d0', '#8a5430'];
    for (const sy of [1, 6, 11]) {
      px(C.woodDD, 2, sy, 12, 4);
      let x = 2;
      while (x < 14) {
        const w = ri(1, 2), h = ri(3, 4);
        const c = cols[ri(0, cols.length - 1)];
        if (rnd() < 0.15) { x += 2; continue; }
        px(c, x, sy + 4 - h, Math.min(w, 14 - x), h);
        px(sh(c, 0.3), x, sy + 4 - h, 1, 1);
        x += w;
      }
      px(C.wood, 1, sy + 4, 14, 1);
    }
  }
  function stairs() {
    const g = cell.g;
    paintGround(g === 'k' || g === 'K' ? g : 'K', cell.v);
    px(C.outline, 1, 0, 14, 16);
    for (let i = 0; i < 4; i++) {
      const y = i * 4;
      const c = sh(C.sfloor, -0.08 * (3 - i));
      px(c, 2, y, 12, 3); px(sh(c, 0.25), 2, y, 12, 1); px(sh(c, -0.35), 2, y + 3, 12, 1);
    }
    px(C.wood, 1, 0, 1, 16); px(C.wood, 14, 0, 1, 16);
  }
  function voidTile() { px(C.void, 0, 0, T, T); }

  // ------------------------------------------------------------------ festive
  function stands() {
    const up = at(0, -1) === 'q', dn = at(0, 1) === 'q';
    seed(9000 + cell.tx * 7 + cell.ty * 13);
    if (!dn) {
      // front railing draped with cloth + bunting
      px('#6a4426', 0, 0, T, T);
      crowdRow(0);
      const stripe = (cell.tx & 1) ? '#c43c3c' : '#f2c14e';
      px(C.outline, 0, 6, T, 10);
      px(stripe, 0, 7, T, 8);
      px(sh(stripe, -0.2), 0, 13, T, 2);
      px(sh(stripe, 0.25), 0, 7, T, 1);
      // emblem on red
      if (cell.tx & 1) { px('#f2c14e', 6, 9, 4, 3); px('#c43c3c', 7, 10, 2, 1); }
      // bunting triangles
      for (let i = 0; i < 4; i++) {
        const col = ['#3f7fd1', '#f2c14e', '#d6453d', '#5bb04a'][(i + cell.tx) % 4];
        px(col, i * 4, 6, 3, 1); px(col, i * 4 + 1, 7, 1, 2);
      }
      px('#2b1d14', 0, 5, T, 1);
      return;
    }
    // benches with crowd
    px('#7a5030', 0, 0, T, T);
    if (!up) {
      // back wall with pennant poles
      px('#5a3820', 0, 0, T, 7);
      px('#8a5a34', 0, 6, T, 1);
      px('#d8d0c0', 3, 0, 1, 6);
      const pc = BANNERS[(cell.tx >> 1) % BANNERS.length];
      px(pc, 4, 0, 5, 2); px(pc, 4, 2, 3, 1); px(pc, 4, 3, 1, 1);
      crowdRow(9);
      return;
    }
    crowdRow(1); crowdRow(9);
  }
  function crowdRow(y) {
    px('#9a6a40', 0, y + 5, T, 2); px('#b88052', 0, y + 5, T, 1);
    const skins = ['#f1c27d', '#e0a878', '#c98e5d', '#f5d0a8', '#a87048'];
    const shirts = ['#d6453d', '#3f7fd1', '#5bb04a', '#f2c14e', '#7b3fb5', '#e07a3a', '#e8e0d0'];
    const hairs = ['#3a2414', '#7a4a24', '#d9a54a', '#1a1a1a', '#a0602a', '#d8d8d8'];
    for (let i = 0; i < 3; i++) {
      if (rnd() < 0.15) continue;
      const x = i * 5 + ri(0, 2);
      const shirt = shirts[ri(0, shirts.length - 1)];
      px(shirt, x, y + 3, 4, 3);
      px(skins[ri(0, skins.length - 1)], x + 1, y, 2, 3);
      px(hairs[ri(0, hairs.length - 1)], x + 1, y, 2, 1);
      if (rnd() < 0.3) { px(skins[0], x - 1 + (rnd() < 0.5 ? 0 : 5), y - 1, 1, 3); } // waving arm
    }
  }
  function tilt() {
    const vert = at(0, -1) === '|' || at(0, 1) === '|';
    const lf = at(-1, 0) === '|', rt = at(1, 0) === '|';
    if (vert) {
      px('rgba(40,20,10,0.25)', 10, 0, 2, T);
      px(C.outline, 5, 0, 6, T);
      for (let y = 0; y < T; y += 4) { px('#e8e0d0', 6, y, 4, 2); px('#c43c3c', 6, y + 2, 4, 2); }
      px('rgba(255,255,255,0.3)', 6, 0, 1, T);
      return;
    }
    groundShadow(8, 13, 8, 1.6);
    px(C.outline, lf ? 0 : 1, 5, (rt ? 16 : 15) - (lf ? 0 : 1), 7);
    for (let x = 0; x < T; x += 4) { px('#e8e0d0', x, 6, 2, 5); px('#c43c3c', x + 2, 6, 2, 5); }
    if (!lf) px(C.outline, 0, 0, 2, 0);
    px('rgba(255,255,255,0.35)', 0, 6, T, 1);
    px(C.woodD, 2, 11, 2, 4); px(C.woodD, 12, 11, 2, 4);
  }
  function bannerPole(v) {
    const lf = at(-1, 0), rt = at(1, 0);
    const wallCh = inSet('#Wcwn', lf) ? lf : inSet('#Wcwn', rt) ? rt : null;
    const c = BANNERS[v % BANNERS.length];
    if (wallCh) {
      // hanging wall banner
      const save = cell.ch; cell.ch = wallCh === 'W' ? '#' : wallCh;
      if (cell.ch === 'n') interiorWall(); else if (cell.ch === 'c') castleWall(true); else if (cell.ch === 'w') stoneWall(); else houseWallBase(!cell.outdoor);
      cell.ch = save;
      px(C.outline, 3, 1, 10, 1); px('#d8b050', 3, 1, 10, 1); px(C.outline, 3, 2, 10, 1);
      px(C.outline, 4, 2, 8, 12);
      px(c, 5, 2, 6, 10); px(sh(c, 0.2), 5, 2, 6, 1); px(sh(c, -0.25), 10, 3, 1, 9);
      px(c, 5, 12, 2, 1); px(c, 9, 12, 2, 1); px(c, 5, 13, 1, 1); px(c, 10, 13, 1, 1);
      px('#f2c14e', 7, 5, 2, 3); px('#f2c14e', 6, 6, 4, 1);
      return;
    }
    groundShadow(8, 14.5, 3, 1);
    px(C.outline, 7, 1, 3, 15); px('#d8d0c0', 8, 2, 1, 13);
    px('#f2c14e', 7, 0, 3, 2); px('#fff0a0', 8, 0, 1, 1);
    px(C.outline, 9, 2, 6, 10);
    px(c, 10, 3, 4, 8); px(sh(c, 0.2), 10, 3, 4, 1);
    px(c, 10, 11, 1, 1); px(c, 13, 11, 1, 1);
    px('#f2c14e', 11, 5, 2, 3); px(sh(c, -0.25), 13, 3, 1, 8);
  }

  function stall() {
    // awning color shared by a run of stalls
    const pal = AWNINGS[cell.extra % AWNINGS.length];
    const lf = at(-1, 0) === 'm', rt = at(1, 0) === 'm';
    // goods counter
    px(C.outline, lf ? 0 : 1, 8, (rt ? 16 : 15) - (lf ? 0 : 1), 8);
    px(C.wood, lf ? 0 : 2, 9, (rt ? 16 : 14) - (lf ? 0 : 2), 6);
    px(C.woodL, lf ? 0 : 2, 9, (rt ? 16 : 14) - (lf ? 0 : 2), 1);
    const goods = [['#e04a3a', '#ff9080'], ['#f2c14e', '#fff0a0'], ['#5bb04a', '#a0e080'], ['#d8a060', '#f0d0a0']][cell.v % 4];
    for (let x = 3; x < 13; x += 3) { px(goods[0], x, 10, 2, 2); px(goods[1], x, 10, 1, 1); }
    if (!lf) px(C.woodDD, 1, 2, 1, 13);
    if (!rt) px(C.woodDD, 14, 2, 1, 13);
    // awning
    px(C.outline, 0, 0, T, 8);
    for (let x = 0; x < T; x += 4) { px(pal[0], x, 0, 2, 7); px(pal[1], x + 2, 0, 2, 7); }
    px('rgba(255,255,255,0.25)', 0, 0, T, 1);
    // scalloped edge
    for (let x = 0; x < T; x += 4) { px(pal[0], x, 7, 2, 1); px(pal[1], x + 2, 7, 2, 1); px(C.outline, x, 8, 4, 0); }
    for (let x = 1; x < T; x += 4) px(C.outline, x + 1, 7, 1, 1);
  }
  function bridge() {
    const wUp = inSet('~;', at(0, -1)), wDn = inSet('~;', at(0, 1));
    const horiz = wUp || wDn || ((at(-1, 0) === 'B' || at(1, 0) === 'B') && !(at(0, -1) === 'B' || at(0, 1) === 'B'));
    px(C.waterD, 0, 0, T, T);
    if (horiz) {
      for (let x = 0; x < T; x += 4) { px(C.woodL, x, 2, 3, 12); px(C.woodD, x + 3, 2, 1, 12); }
      px(C.woodDD, 0, 0, T, 2); px(C.wood, 0, 0, T, 1);
      px(C.woodDD, 0, 14, T, 2); px(C.wood, 0, 14, T, 1);
      px(C.woodDD, 0, 15, T, 1);
      if (at(-1, 0) !== 'B') { px(C.woodDD, 0, 0, 2, 3); px(C.woodDD, 0, 13, 2, 3); }
      if (at(1, 0) !== 'B') { px(C.woodDD, 14, 0, 2, 3); px(C.woodDD, 14, 13, 2, 3); }
    } else {
      for (let y = 0; y < T; y += 4) { px(C.woodL, 2, y, 12, 3); px(C.woodD, 2, y + 3, 12, 1); }
      px(C.woodDD, 0, 0, 2, T); px(C.wood, 0, 0, 1, T);
      px(C.woodDD, 14, 0, 2, T); px(C.wood, 15, 0, 1, T);
      if (at(0, -1) !== 'B') { px(C.woodDD, 0, 0, 3, 2); px(C.woodDD, 13, 0, 3, 2); }
      if (at(0, 1) !== 'B') { px(C.woodDD, 0, 14, 3, 2); px(C.woodDD, 13, 14, 3, 2); }
    }
  }
  function torchBase() {
    // wall-mounted if beside/above a wall, else standing post
    const lf = at(-1, 0), rt = at(1, 0), up = at(0, -1);
    const wallCh = inSet('ncw#', lf) ? lf : inSet('ncw#', rt) ? rt : inSet('ncw#', up) ? up : null;
    if (wallCh) {
      const save = cell.ch; cell.ch = wallCh;
      if (wallCh === 'n') interiorWall(); else if (wallCh === 'c') castleWall(); else if (wallCh === 'w') stoneWall(); else houseWallBase(false);
      cell.ch = save;
      px(C.outline, 6, 8, 4, 5); px('#5a5862', 7, 8, 2, 4); px('#8a8892', 5, 12, 6, 1);
      px(C.woodDD, 7, 5, 2, 4);
    } else {
      groundShadow(8, 14.5, 3.5, 1.2);
      px(C.outline, 6, 6, 4, 10); px(C.woodD, 7, 6, 2, 9); px(C.wood, 7, 6, 1, 9);
      px('#5a5862', 5, 5, 6, 2);
    }
  }

  // ------------------------------------------------------------------ dispatch
  // object chars that sit on a ground
  const ON_GROUND = 'TtrbfFhxSop|m*euvlB';

        this.hline(x1, x2, y1, ch, wd);
        this.vline(x2, y1, y2, ch, wd);
      }
      return this;
    }
    // Paste rows; spaces are transparent.
    stamp(x, y, rows) {
      rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] !== ' ') this.set(x + i, y + j, r[i]); });
      return this;
    }
    // Replace `on` tiles in a rect with ch at given density (deterministic).
    scatter(x, y, w, h, ch, dens, seed = 1, on = '.') {
      const rnd = G.U.rng(seed);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        const r = rnd();
        if (r < dens && (on == null || this.get(x + i, y + j) === on)) this.set(x + i, y + j, ch);
      }
      return this;
    }
    // Rough ellipse blob.
    blob(cx, cy, rx, ry, ch, seed = 1, on = null, rough = 0.25) {
      const rnd = G.U.rng(seed * 7919 + 13);
      for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
        const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
        if (d <= 1 - rough + rnd() * rough * 2 && (on == null || on.includes(this.get(x, y)))) this.set(x, y, ch);
      }
      return this;
    }
    // Clear a rough corridor of `ch` (radius rad) around an orthogonal polyline.
    carve(pts, rad = 2, ch = '.', seed = 1, on = null) {
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
        const pass = (ax, ay, bx, by) => {
          for (let y = Math.min(ay, by) - rad; y <= Math.max(ay, by) + 1 + rad; y++)
            for (let x = Math.min(ax, bx) - rad; x <= Math.max(ax, bx) + 1 + rad; x++)
              if (on == null || on.includes(this.get(x, y))) this.set(x, y, ch);
        };
        pass(x1, y1, x2, y1); pass(x2, y1, x2, y2);
      }
      pts.forEach(([x, y], i) => this.blob(x + 0.5, y + 0.5, rad + 2, rad + 1.5, ch, seed + i, on, 0.45));
      return this;
    }
    // House: roof rows on top, wall rows below, windows on wall rows, door on bottom row.
    house(x, y, w, h, o = {}) {
      const roofH = o.roof != null ? o.roof : Math.max(1, h - 2);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, j < roofH ? (o.roofCh || '^') : (o.wallCh || '#'));
      for (const wx of o.win || []) for (let j = roofH; j < h; j++) if (j === h - 1 || o.tallWin) this.set(x + wx, y + j, 'W');
      const dx = o.door != null ? o.door : Math.floor(w / 2);
      this.set(x + dx, y + h - 1, 'd');
      return { x: x + dx, y: y + h - 1 };
    }
    rows() { return this.a.map((r) => r.join('')); }
  }
  L.grid = (w, h, fill) => new Grid(w, h, fill);

  // Interior room: void outside, 2-row back wall, side walls, bottom wall with door.
  L.room = (w, h, floor = 'k', doorX = null, wall = 'n') => {

})();

        G.scenes.remove(scene);
        G.state.look = 'heroKnight';
        G.state.flags.credits_seen = true;
        try { G.save(); } catch (e) { console.error(e); }
        try { if (G.world && G.world.refresh) G.world.refresh(); } catch (e) { console.error(e); }
      }, { ms: 500 });
      resolve();
    };
    const scene = {
      name: 'credits', opaque: true,
      enter() { try { G.music.play('victory'); } catch (e) { /* ignore */ } },
      update(dt) {
        t += dt;
        if (phase === 'roll') {
          const fast = G.input.down('a') || !!G.input.rHold();
          y += dt * (fast ? 70 : 18);
          if (layW > 0 && y > total + G.H * 0.55) { phase = 'end'; endT = 0; try { G.music.play('village'); } catch (e) { /* ignore */ } }
          G.input.anyTap();
        } else {
          endT += dt;
          if (endT > 1.6 && G.input.anyTap()) finish();
        }
      },
      draw(ctx) {
        const W = G.W, Hh = G.H;
        const grd = ctx.createLinearGradient(0, 0, 0, Hh);
        grd.addColorStop(0, '#0f0c26'); grd.addColorStop(0.6, '#2a1a40'); grd.addColorStop(1, '#5a2a3a');

        D.rect(0, gy, W, 2, '#3a5a2a');

        }
        layout(ctx);
        if (phase === 'roll') {
          let ly = Hh - y;
          for (const r of roll) {
            if (ly > -30 - r.h && ly < gy - 4) {
              const a = G.U.clamp(Math.min((ly - 6) / 30, (gy - 10 - ly) / 30), 0, 1);
              ctx.globalAlpha = a;
              D.text(r.t, W / 2, ly, { size: r.size, align: 'center', color: r.color, shadow: true, maxW: W - 24 });
              ctx.globalAlpha = 1;
            }
            ly += r.h;
          }
          D.text('hold to speed up', W - 4, 4, { size: 6, align: 'right', color: 'rgba(255,255,255,0.4)' });
        } else {
          const a = G.U.clamp(endT / 1.2, 0, 1);
          ctx.globalAlpha = a;
          D.text('The road goes on…', W / 2, Hh * 0.42, { size: 14, align: 'center', color: '#ffe48a', shadow: true, bold: true });

          ctx.globalAlpha = 1;
        }
      },
    };
    G.scenes.fade(() => { G.scenes.push(scene); }, { ms: 500 });
  });
})();

  // ---------------------------------------------------------------- Harrowfield: Lady Rowena and the Lists
  story.rowena = async (c, npc) => {

      if (G.player.has('letter')) {

        c.take('letter', 1);
      } else await S(['A newcomer to the Lists! Welcome.']);
      await S(['So, you would joust? Every jouster starts with a practice lance. Here.', 'Blunted ash. It breaks on purpose. Mostly.']);
      L().giveEquip(c, 'practice_lance');
      c.setFlag('rowena_met');
    }
    if (!L().hasLance()) { await S('Lost your lance? Here, take another practice one.'); L().giveEquip(c, 'practice_lance'); }
    L().ensureEquipped('lance');
    if (!L().hasHorse()) {
      await S(['But you cannot joust on foot, dear. That is just running at people.', 'Tobias sells horses at the stable west of the square.', 'Rumour says he lost his lucky horseshoe in Greenmeadow. Find it and he might be generous.']);
      return;

    L().ensureEquipped('horse');
    if (!F('tilt_lesson')) {
      await S([
        'A horse AND a lance! Now, your first tilting lesson.',
        'CHARGE: tap the right side in rhythm to spur. Keep the speed in the sweet zone.',
        'AIM: drag on the left to move your lance tip onto their shield. The gold boss scores best.',
        'IMPACT: a ring shrinks around the target. Tap right just as it closes!',
        'My squire Hobb will play the quintain. Do try not to kill him. He owes me money.',
      ]);

    await G.content.story.hallMaster(c, npc, 'harrowfield_lists');
  };

  G.content.story = Object.assign(G.content.story || {}, story);
})();

/* ---- battle/archery.js ---- */
try {
// Archery contest (DESIGN.md §7c): first-person view down a festive range.
// Hold R to draw, L-drag to aim, release to loose. 3 ends × 3 arrows vs rivals.
(() => {
  const U = G.U;
  const D = () => G.draw;

  const CAM_H = 1.6;   // eye height (m)
  const FACE_H = 1.25; // target face centre height (m)
  const ARROWS_PER_END = 3, ENDS = 3;
  const Z0 = 2.2;      // arrow launch depth (m)
  const RING_COL = ['#f6d04a', '#d6453d', '#3f7fd1', '#26262c', '#f4efe2'];
  const RING_LINE = ['#a8801a', '#8a231d', '#244f8e', '#6a6a72', '#9a9488'];
  const SCORE_COL = { 10: '#f6d04a', 8: '#e8574e', 6: '#4f8fe1', 4: '#3a3a42', 2: '#f4efe2', 0: '#8a7a6a' };

  const TIERS = {
    1: { D: 22, R: 0.6, wMin: 0.6, wMax: 1.1, osc: 0.08, perArrow: 0, gust: 0, change: 0, move: 0 },
    2: { D: 30, R: 0.6, wMin: 1.2, wMax: 2.4, osc: 0.3, perArrow: 0.7, gust: 0, change: 0, move: 0 },
    3: { D: 32, R: 0.6, wMin: 0.9, wMax: 2.0, osc: 0.25, perArrow: 0.4, gust: 1.7, change: 0, move: 'all', moveAmp: 1.3, moveSpd: 0.85 },
    4: { D: 40, R: 0.5, wMin: 1.3, wMax: 2.6, osc: 0.3, perArrow: 0.5, gust: 2.1, change: 1, move: 'final', moveAmp: 1.1, moveSpd: 0.75 },
  };

  // --- rival simulation -------------------------------------------------------
  function expScore(s) {
    let e = 0;
    for (let k = 1; k <= 5; k++) { const a = 0.2 * k; e += 2 * (1 - Math.exp(-(a * a) / (2 * s * s))); }
    return e;
  }
  function sigmaFor(mean) {
    mean = U.clamp(mean, 0.5, 9.8);
    let lo = 0.005, hi = 6;
    for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (expScore(m) > mean) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  function gauss() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(Math.PI * 2 * Math.random()); }
  function ringScore(r, r10) {
    if (r <= r10) return 10;
    if (r <= 0.4) return 8;
    if (r <= 0.6) return 6;
    if (r <= 0.8) return 4;
    if (r <= 1.0) return 2;
    return 0;
  }
  function rivalArrow(rv, pressure) {
    const s = rv.sigma * rv.form * (1 + pressure * rv.nerve * Math.random() * 1.6);
    const r = s * Math.sqrt(-2 * Math.log(1 - Math.random()));
    const a = Math.random() * Math.PI * 2;
    return { score: ringScore(r, 0.2), rx: Math.cos(a) * r, ry: Math.sin(a) * r, r };
  }

  function make(opts, done) {
    opts = opts || {};
    const tier = U.clamp(opts.tier | 0 || 1, 1, 4);
    const T = TIERS[tier];
    const st = G.player.stats();
    const bow = st.bow || G.items.short_bow || { power: 0.8, steady: 0.3, draw: 0.9, name: 'Short Bow' };
    const perk = (id) => G.player.hasPerk(id);
    const drawTime = (bow.draw || 0.9) * (perk('quick_draw') ? 0.65 : 1);
    const bp = bow.power || 1, steady = U.clamp(bow.steady || 0.3, 0, 0.95);
    const R10 = perk('bullseye') ? 0.28 : 0.2;
    const breathTime = 2.6 + 2 * steady;
    const swayBase = 0.0058 * T.D * (1 - 0.6 * steady) * (perk('calm_breath') ? 0.65 : 1);
    const pLook = G.chars.resolve(G.state.look || 'hero');

    // rivals
    const rivals = (opts.rivals && opts.rivals.length ? opts.rivals : ['arch_tam']).map((id) => {
      let r = G.roster.archery && G.roster.archery[id];
      if (!r) { console.warn('archery: unknown rival', id); r = { name: id, look: 'archer', skill: 0.6 }; }
      const skill = U.clamp(r.skill ?? 0.6, 0.05, 0.98);
      return {
        id, name: r.name || id, look: r.look || 'archer', quip: r.quip, skill,
        sigma: sigmaFor(skill * 10), spread: r.spread ?? 1, nerve: r.nerve ?? (1 - skill) * 0.9,
        form: 1, ends: [], total: 0, sd: null, anim: Math.random() * 6, shootT: -1,
      };
    });

    // --- scene state ------------------------------------------------------------
    let t = 0, phase = 'intro', phaseT = 0;
    let end = 0, arrowIdx = 0;
    const mine = [];           // per end: [{score, rx, ry, r}]
    let myTotal = 0;
    let finished = false;
    let hintT = 0, hintDone = false;
    const introDur = rivals.some((r) => r.quip) ? 3.2 : G.BUI.INTRO_T;
    let armed = false, drawing = false, power = 0, breath = 1, shakeT = 0, fullT = 0;
    let aimX = 0, aimY = 0, lastL = null;
    let swayT = Math.random() * 10, swX = 0, swY = 0;
    let zoom = 1, shake = 0, recoil = 0, stringVib = 0, targetWob = 0;
    let flight = null, lastHit = null, popup = null;
    let stuck = [];            // arrows in the target this end {rx, ry} (m, rel. to face)
    let grounded = [];         // arrows in grass {x, z}
    let board = null, sudden = false, sdResult = null, outcome = null;
    let drawEl = 0, heartT = 0, creaked = false, fullClick = false, bowIn = 0;
    let targetT = Math.random() * 10;
    const parts = [];
    const petals = [];
    const crowd = [];
    let cheer = 0;

    // wind
    const wind = { base: 0, target: 0, cur: 0, gust: 0, gustT: 0, gustDur: 0, gustAmp: 0, nextGust: 3, changeT: 6, osc: Math.random() * 10 };
    function rollWind(keepSign) {
      const sgn = keepSign && wind.base ? Math.sign(wind.base) : (Math.random() < 0.5 ? -1 : 1);
      wind.target = sgn * U.rand(T.wMin, T.wMax);
    }
    rollWind(false);
    wind.base = wind.target; wind.cur = wind.base;

    // crowd
    const crowdLooks = ['villagerM', 'villagerF', 'child', 'merchant', 'elder', 'innkeep', 'smith', 'monk', 'guard', 'noble'];
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < 9; i++) {
        crowd.push({
          side, row: i % 2, i: Math.floor(i / 2) + (i % 2) * 0.5,
          look: U.pick(crowdLooks), ph: Math.random() * 6, jump: 0,
        });
      }
    }
    for (let i = 0; i < 10; i++) petals.push({ x: Math.random(), y: Math.random(), s: U.rand(0.6, 1.4), ph: Math.random() * 6, c: U.pick(['#fff3b0', '#ffb0c8', '#ffffff', '#ffd27a']) });

    // geometry (recomputed each frame; G.W/G.H may change)
    const g = { W: 0, H: 0, min: 0, F: 0, cx: 0, hy: 0, land: false, lat: 1 };
    function geo() {
      g.W = G.W; g.H = G.H; g.min = Math.min(g.W, g.H); g.land = g.W > g.H * 1.15;
      g.F = (4.2 + 0.5 * Math.max(0, tier - 2)) * g.min; g.cx = g.W / 2; g.hy = g.H * (g.land ? 0.36 : 0.4);
      g.pvx = g.cx; g.pvy = g.hy + (CAM_H - FACE_H) * g.F / T.D;
      g.Rpx = T.R * g.F / T.D;
    }
    const proj = (x, y, z) => { const s = g.F / z; return [g.cx + x * s, g.hy + (CAM_H - y) * s]; };
    // world-layer (pre-zoom) → screen
    const toScr = (x, y) => [g.pvx + (x - g.pvx) * zoom + shx, g.pvy + (y - g.pvy) * zoom + shy];
    let shx = 0, shy = 0;

    const moving = () => T.move === 'all' || (T.move === 'final' && end === ENDS - 1 && !sudden) || (T.move === 'final' && sudden);
    const targetX = (tt) => (moving() ? T.moveAmp * Math.sin(tt * T.moveSpd) : 0);

    function swayAmp() {
      let m;
      if (!drawing) m = 0.55;
      else if (power < 1) m = U.lerp(0.55, 0.9, power);
      else m = 0.7 + 1.1 * Math.pow(1 - breath, 1.5);
      return swayBase * m;
    }

    // --- phases -----------------------------------------------------------------
    function setPhase(p) { phase = p; phaseT = 0; }
    function startEnd() {
      stuck = []; grounded = [];
      arrowIdx = 0;
      mine[end] = [];
      for (const rv of rivals) rv.form = Math.max(0.6, 1 + (Math.random() - 0.5) * 0.35 * rv.spread);
      if (tier >= 2) rollWind(Math.random() < 0.7);
      toAim();
    }
    function toAim() {
      armed = false; drawing = false; power = 0; breath = 1; shakeT = 0; fullT = 0; creaked = false; fullClick = false;
      setPhase('aim');
    }

    function loose() {
      const p = power;
      drawing = false;
      if (!hintDone) { hintDone = true; }
      const v = 30 + 42 * p * bp;
      const tF = T.D / v;
      const dur = U.clamp(tF * 1.7, 0.45, 1.0);
      const drift = wind.cur * tF * 0.62 / bp;
      const drop = (1 - p) * T.D * 0.045;
      const noise = 0.012 * T.D / 22 * (1.3 - steady);
      const hx = aimX + swX + drift + gauss() * noise;
      const hy = aimY + swY - drop + gauss() * noise;
      const short = p < 0.4;
      // launch point: the arrowhead on screen, unprojected to z0
      const B = bowGeo();
      const ahx = B.gx - B.vx * B.L * 0.05, ahy = B.gy - B.vy * B.L * 0.05;
      const wx = g.pvx + (ahx - g.pvx) / zoom, wy = g.pvy + (ahy - g.pvy) / zoom;
      const x0 = (wx - g.cx) * Z0 / g.F, y0 = CAM_H - (wy - g.hy) * Z0 / g.F;
      flight = { t: 0, dur, hx, hy, short, p, x0, y0, zEnd: short ? T.D * U.lerp(0.25, 0.8, p / 0.4) : T.D, tLand: targetT + dur };
      G.sfx.play('arrow');
      G.sfx.tone(short ? 330 : 210, 0.16, { type: 'triangle', vol: 0.18, slide: short ? 200 : 130 });
      recoil = 1; stringVib = 1;
      power = 0;
      setPhase('flight');
    }

    function impact() {
      const f = flight;
      const ms = mine[end] || (mine[end] = []);
      let res;
      if (f.short) {
        grounded.push({ x: f.hx * (f.zEnd / T.D), z: f.zEnd });
        res = { score: 0, rx: 9, ry: 9, r: 99, kind: 'short' };
        G.sfx.tone(1900, 0.05, { type: 'square', vol: 0.06 });
        G.sfx.tone(1350, 0.08, { type: 'triangle', vol: 0.08, delay: 0.04 });
        dust(f.hx * (f.zEnd / T.D), 0, f.zEnd, '#8a6a3a', 8);
      } else {
        const tx = targetX(f.tLand);
        const rx = (f.hx - tx) / T.R, ry = (f.hy) / T.R;
        const r = Math.hypot(rx, ry);
        const score = ringScore(r, R10);
        if (r <= 1) {
          res = { score, rx, ry, r, kind: score === 10 ? 'bull' : 'ring' };
          stuck.push({ rx: f.hx - tx, ry: f.hy });
          G.sfx.play('thud');
          targetWob = 1; shake = Math.max(shake, score >= 8 ? 3 : 2);
          dust(f.hx, FACE_H + f.hy, T.D, '#e8c86a', 10);
          if (score === 10) {
            G.sfx.play('parry');
            setTimeout(() => G.sfx.play('coin'), 120);
            sparkle(f.hx, FACE_H + f.hy);
            cheer = 2.2; G.sfx.play('crowd');
          } else if (score >= 8) { cheer = 1.2; G.sfx.play('crowd'); }
        } else if (Math.abs(rx) <= 1.3 && ry <= 1.25 && ry >= -1.3) {
          res = { score: 0, rx, ry, r, kind: 'hay' };
          stuck.push({ rx: f.hx - tx, ry: f.hy });
          G.sfx.play('thud'); shake = 1.5; targetWob = 0.5;
          dust(f.hx, FACE_H + f.hy, T.D, '#e8c86a', 14);
        } else {
          res = { score: 0, rx, ry, r, kind: 'miss' };
          grounded.push({ x: f.hx, z: T.D + 4 });
          G.sfx.play('bush');
        }
      }

        sdResult.you = res;
      } else {
        ms.push(res);

      }

      popup = { text: label, score: res.score, kind: res.kind, t: 0 };

    }

    function afterHit() {
      if (sudden) { buildSdBoard(); setPhase('sdboard'); return; }
      arrowIdx++;

      const pressure = end === ENDS - 1 ? 0.6 : end === 1 ? 0.2 : 0;

        rv.ends[end] = arr;
      }
      buildBoard();
      setPhase('board');

    function buildBoard() {
      const rows = [{ you: true, name: G.state.name || 'You', look: G.state.look || 'hero', arrows: mine[end], prev: myTotal - sum(mine[end]), total: myTotal }];
      for (const rv of rivals) {
        const s = sum(rv.ends[end]);
        rows.push({ name: rv.name, look: rv.look, arrows: rv.ends[end], prev: rv.total, total: rv.total + s, rv });
        rv.total += s;
      }
      board = { rows, t: 0, ticks: 0 };
    }
    function buildSdBoard() {
      const rows = [{ you: true, name: G.state.name || 'You', look: G.state.look || 'hero', sd: sdResult.you }];
      for (const rv of sdResult.rivals) rows.push({ name: rv.name, look: rv.look, sd: rv.sd, rv });

    const sum = (a) => (a || []).reduce((s, x) => s + x.score, 0);
    const bestRival = () => rivals.reduce((b, r) => (!b || r.total > b.total ? r : b), null);

    function afterBoard() {
      if (board && board.sd) return finish();

        sudden = true;

        stuck = []; grounded = [];
        if (tier >= 2) rollWind(Math.random() < 0.5);
        setPhase('sdcard');
        G.sfx.play('horn');
        return;
      }
      finish();
    }

    function finish() {
      const best = bestRival();
      let won;
      if (sudden && sdResult && sdResult.you) {
        const yd = sdResult.you.r;
        won = sdResult.rivals.every((r) => yd < r.sd.r);
      } else won = myTotal >= best.total;
      outcome = { won, you: myTotal, best: best.total };
      setPhase('outro');
      G.music.stop();
      if (won) { G.sfx.play('win'); G.sfx.play('crowd'); cheer = 4; setTimeout(() => G.music.play('victory'), 900); for (let i = 0; i < 80; i++) confetti(); }
      else G.sfx.play('lose');
    }
    function end_(won, score) {
      if (finished) return;
      finished = true;
      done({ won, score });
    }

    // --- particles --------------------------------------------------------------
    function dust(x, y, z, col, n) {
      const [sx, sy] = proj(x, y, z);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = U.rand(10, 45);
        parts.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, g: 90, life: U.rand(0.3, 0.7), max: 0.7, c: Math.random() < 0.5 ? col : U.shade(col, -0.3), sz: Math.random() < 0.3 ? 2 : 1, world: true });
      }
    }
    function sparkle(x, y) {
      const [sx, sy] = proj(targetX(targetT) + x - targetX(targetT), y, T.D);
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2, s = U.rand(25, 70);
        parts.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 10, life: U.rand(0.6, 1.1), max: 1.1, c: U.pick(['#fff3b0', '#ffd04a', '#ffffff']), sz: 2, star: true, world: true });
      }
    }
    function confetti() {
      parts.push({ x: Math.random() * G.W, y: -10 - Math.random() * G.H * 0.5, vx: U.rand(-20, 20), vy: U.rand(30, 70), g: 20, life: U.rand(2.5, 4), max: 4, c: U.pick(['#f6d04a', '#d6453d', '#3f7fd1', '#5bb04a', '#ffffff', '#ff8ad0']), sz: 2, conf: true, ph: Math.random() * 6 });
    }

    // --- update -----------------------------------------------------------------
    function updateWind(dt) {
      wind.osc += dt;
      if (T.change) {
        wind.changeT -= dt;
        if (wind.changeT <= 0) { wind.changeT = U.rand(5, 8); rollWind(Math.random() < 0.55); }
      }
      wind.base = U.approach(wind.base, wind.target, dt * 0.9);
      if (T.gust) {
        if (wind.gustT > 0) {
          wind.gustT -= dt;
          wind.gust = wind.gustAmp * Math.sin(Math.PI * (1 - Math.max(0, wind.gustT) / wind.gustDur));
        } else {
          wind.gust = 0;
          wind.nextGust -= dt;
          if (wind.nextGust <= 0) {
            wind.gustDur = U.rand(1.4, 2.6); wind.gustT = wind.gustDur;
            wind.gustAmp = (Math.random() < 0.65 ? Math.sign(wind.base || 1) : -Math.sign(wind.base || 1)) * U.rand(0.7, 1) * T.gust;
            wind.nextGust = U.rand(2.5, 5.5);
          }
        }
      }
      wind.cur = wind.base + T.osc * (Math.sin(wind.osc * 0.9) + 0.5 * Math.sin(wind.osc * 2.3 + 1)) / 1.5 + wind.gust;
    }

    function updateAim(dt) {
      const inp = G.input;
      const busy = G.ui.busy();
      // aim: relative L drag, else keyboard stick
      const lp = inp.lHold();
      const mPerPx = T.D / g.F / zoom;
      if (lp && !busy) {
        if (lastL && lastL.id === lp.id) {
          aimX += (lp.x - lastL.x) * 0.6 * mPerPx;
          aimY -= (lp.y - lastL.y) * 0.6 * mPerPx;
        }
        lastL = { id: lp.id, x: lp.x, y: lp.y };
      } else {
        lastL = null;
        const s = inp.stick;
        if (!busy && s.mag > 0.1) {
          const sp = T.R * 0.9 * (drawing ? 0.7 : 1);
          aimX += s.x * sp * dt; aimY -= s.y * sp * dt;
        }
      }
      aimX = U.clamp(aimX, -4, 4); aimY = U.clamp(aimY, -2.2, 2.2);

      // draw
      const held = !busy && inp.down('a');
      if (!held) armed = true;
      if (phase !== 'aim') return;
      if (armed && held && !drawing) { drawing = true; power = 0; breath = 1; shakeT = 0; fullT = 0; drawEl = 0; }
      if (drawing) {
        drawEl += dt;
        if (!creaked) { creaked = true; G.sfx.tone(120, drawTime * 0.9, { type: 'sawtooth', vol: 0.035, slide: 240 }); }

    // ------------------------------------------------------------------ hint

    drawHint(ctx, lines, alpha, y) {
