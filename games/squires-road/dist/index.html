<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1640">
<title>Squire's Road</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; image-rendering: pixelated; }
</style>
</head>
<body>
<script>
/* ---- core/util.js ---- */
try {
// Core: global namespace + math helpers.
window.G = window.G || {};
(() => {
  const U = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a = 0, b = 1) => a + Math.random() * (b - a),
    randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    chance: (p) => Math.random() < p,
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    angle: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
    sign: (v) => (v < 0 ? -1 : v > 0 ? 1 : 0),
    approach: (cur, target, step) =>
      cur < target ? Math.min(cur + step, target) : Math.max(cur - step, target),
    angleDiff: (a, b) => {
      let d = b - a;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    },
    shuffle: (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    // Weighted pick from [{w, ...}]
    weighted: (list) => {
      let total = 0;
      for (const e of list) total += e.w ?? 1;
      let r = Math.random() * total;
      for (const e of list) {
        r -= e.w ?? 1;
        if (r <= 0) return e;
      }
      return list[list.length - 1];
    },
    ease: {
      linear: (t) => t,
      inQuad: (t) => t * t,
      outQuad: (t) => 1 - (1 - t) * (1 - t),
      inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
      outCubic: (t) => 1 - Math.pow(1 - t, 3),
      outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
      outElastic: (t) =>
        t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1,
    },
    // Split text into lines that fit maxW using the current ctx font.
    wrapText: (ctx, text, maxW) => {
      const out = [];
      for (const para of String(text).split('\n')) {
        const words = para.split(' ');
        let line = '';
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && line) {
            out.push(line);
            line = w;
          } else line = test;
        }
        out.push(line);
      }
      return out;
    },
    // Tiny seeded RNG (mulberry32) for deterministic decoration.
    rng: (seed) => {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    hash2: (x, y) => {
      let h = (x * 374761393 + y * 668265263) | 0;
      h = (h ^ (h >>> 13)) * 1274126177;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    },
    sleep: (ms) => new Promise((r) => G.timers.add(ms, r)),
    // Shade a #rrggbb color by amt (-1..1)
    shade: (hex, amt) => {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
      else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
      const h = (v) => Math.round(v).toString(16).padStart(2, '0');
      return '#' + h(r) + h(g) + h(b);
    },
  };
  G.U = U;
  G.TILE = 16;
  // Registries filled by data/content files (safe at load time in any order).
  G.roster = { sword: {}, joust: {}, archery: {} };
  G.maps = {};
  G.halls = {};
  G.shops = {};
  G.debug = {};
  G.time = 0; // seconds since boot (game-time; advances in the main loop)

  // Game-time timers (pause with the loop; used by U.sleep / c.wait).
  const list = [];
  G.timers = {
    add(ms, fn) { list.push({ t: ms / 1000, fn }); },
    update(dt) {
      for (let i = list.length - 1; i >= 0; i--) {
        list[i].t -= dt;
        if (list[i].t <= 0) { const fn = list[i].fn; list.splice(i, 1); fn(); }
      }
    },
  };

  G.PAL = {
    ink: '#2b1d14',
    paper: '#f4e4c1',
    paperDark: '#d9c08f',
    edge: '#7a4b2a',
    gold: '#f2c14e',
    red: '#d6453d',
    green: '#5bb04a',
    blue: '#3f7fd1',
    sky: '#8fd3ff',
    white: '#ffffff',
    shadow: 'rgba(0,0,0,0.28)',
    hp: '#e0473c',
    sta: '#f2c14e',
    xp: '#6fc3ff',
    dim: 'rgba(20,12,8,0.55)',
  };
})();

} catch (e) { console.error('load error in core/util.js', e); }
/* ---- core/gfx.js ---- */
try {
// Core: canvas setup, logical resolution, drawing helpers.
(() => {
  const MIN_SHORT = 180; // short side in logical px, at least
  const FONT = '"Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif';

  const canvas = document.createElement('canvas');
  canvas.id = 'game';
  const ctx = canvas.getContext('2d', { alpha: false });

  const gfx = {
    canvas, ctx, scale: 1, dpr: 1, cssW: 0, cssH: 0,
    mount() {
      document.body.appendChild(canvas);
      window.addEventListener('resize', () => gfx.resize());
      window.addEventListener('orientationchange', () => setTimeout(() => gfx.resize(), 100));
      gfx.resize();
    },
    resize() {
      const vv = window.visualViewport;
      const cssW = Math.floor(vv ? vv.width : window.innerWidth);
      const cssH = Math.floor(vv ? vv.height : window.innerHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const short = Math.min(cssW, cssH);
      // Integer CSS scale so pixel art stays crisp; never below 1.
      let scale = Math.max(1, Math.floor(short / MIN_SHORT));
      // Allow fractional scale on tiny screens / desktop very large ones.
      if (short / scale > MIN_SHORT * 1.6) scale = short / (MIN_SHORT * 1.25);
      gfx.cssW = cssW; gfx.cssH = cssH; gfx.dpr = dpr; gfx.scale = scale;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      G.W = Math.ceil(cssW / scale);
      G.H = Math.ceil(cssH / scale);
      gfx.reset();
      if (G.scenes) for (const s of G.scenes.stack) s.resize && s.resize();
    },
    reset() {
      ctx.setTransform(gfx.scale * gfx.dpr, 0, 0, gfx.scale * gfx.dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },
    toLogical(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      return { x: (clientX - r.left) / gfx.scale, y: (clientY - r.top) / gfx.scale };
    },
    // Offscreen canvas helper.
    makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.imageSmoothingEnabled = false;
      return [c, x];
    },
  };
  G.gfx = gfx;
  G.FONT = FONT;

  const draw = {
    font(size = 8, bold = false) {
      return `${bold ? 'bold ' : ''}${size}px ${FONT}`;
    },
    text(str, x, y, o = {}) {
      const size = o.size || 8;
      ctx.font = draw.font(size, o.bold !== false && size <= 10 ? true : !!o.bold);
      ctx.textAlign = o.align || 'left';
      ctx.textBaseline = o.baseline || 'top';
      str = String(str);
      if (o.maxW) {
        const lines = G.U.wrapText(ctx, str, o.maxW);
        const lh = o.lineH || size * 1.25;
        lines.forEach((ln, i) => draw.text(ln, x, y + i * lh, { ...o, maxW: 0 }));
        return lines.length * lh;
      }
      if (o.outline) {
        ctx.lineWidth = o.outlineW || Math.max(1.5, size / 5);
        ctx.strokeStyle = o.outline;
        ctx.lineJoin = 'round';
        ctx.strokeText(str, x, y);
      }
      if (o.shadow) {
        ctx.fillStyle = o.shadow === true ? 'rgba(0,0,0,0.45)' : o.shadow;
        ctx.fillText(str, x + 0.75, y + 0.75);
      }
      ctx.fillStyle = o.color || G.PAL.ink;
      ctx.fillText(str, x, y);
      return size * 1.25;
    },
    measure(str, size = 8, bold = true) {
      ctx.font = draw.font(size, bold);
      return ctx.measureText(String(str)).width;
    },
    rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    },
    rrect(x, y, w, h, r, fill, stroke, lw = 1) {
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
    },
    circle(x, y, r, fill, stroke, lw = 1) {
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
    },
    line(x1, y1, x2, y2, color, lw = 1) {
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.lineCap = 'round';
      ctx.stroke();
    },
    shadow(x, y, w, alpha = 0.28) {
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(x, y, w / 2, w / 5, 0, 0, Math.PI * 2);
      ctx.fill();
    },
    bar(x, y, w, h, frac, fg, bg = 'rgba(0,0,0,0.45)', border = '#1a120c') {
      frac = G.U.clamp(frac, 0, 1);
      ctx.fillStyle = border;
      ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.fillStyle = bg;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = fg;
      ctx.fillRect(x, y, Math.round(w * frac * 2) / 2, h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(x, y, Math.round(w * frac * 2) / 2, Math.max(1, h / 3));
    },
    // Standard parchment panel.
    panel(x, y, w, h, o = {}) {
      const P = G.PAL;
      draw.rrect(x + 1, y + 2, w, h, 4, 'rgba(0,0,0,0.35)');
      draw.rrect(x, y, w, h, 4, o.fill || P.paper, o.edge || P.edge, 2);
      draw.rrect(x + 3, y + 3, w - 6, h - 6, 2, null, o.inner || P.paperDark, 1);
    },
    // Immediate-mode button. Returns true when tapped this frame.
    button(x, y, w, h, label, o = {}) {
      const P = G.PAL;
      const disabled = !!o.disabled;
      const hit = disabled ? null : G.input.consumeTap({ x, y, w, h });
      const pressed = !disabled && G.input.pointerIn({ x, y, w, h });
      const base = disabled ? '#9b8f7d' : o.color || '#c9893c';
      const oy = pressed ? 1 : 0;
      draw.rrect(x, y + 2, w, h, 4, G.U.shade(base, -0.45));
      draw.rrect(x, y + oy, w, h - (pressed ? 1 : 0), 4, base, G.U.shade(base, -0.55), 1);
      draw.rrect(x + 2, y + oy + 1, w - 4, Math.max(2, h / 2 - 2), 3, 'rgba(255,255,255,0.18)');
      if (o.selected) draw.rrect(x - 1.5, y - 1.5 + oy, w + 3, h + 3, 5, null, '#fff3b0', 1.5);
      draw.text(label, x + w / 2, y + h / 2 + oy, {
        size: o.size || 8, align: 'center', baseline: 'middle',
        color: disabled ? '#e6dccb' : o.textColor || '#fffaf0', shadow: 'rgba(0,0,0,0.5)', bold: true,
      });
      if (hit) G.sfx && G.sfx.play('select');
      return !!hit;
    },
  };
  G.draw = draw;
})();

} catch (e) { console.error('load error in core/gfx.js', e); }
/* ---- core/input.js ---- */
try {
// Core: invisible joypad. Left half = floating stick, right half = gestures.
(() => {
  const STICK_R = 22;
  const TAP_MS = 260, TAP_DIST = 12, HOLD_MS = 200, FLICK_MS = 240, FLICK_DIST = 20;

  const KEYMAP = {
    KeyZ: 'a', KeyJ: 'a', Space: 'a', Enter: 'a', NumpadEnter: 'a',
    KeyX: 'b', KeyK: 'b', Backspace: 'b',
    KeyC: 'c', KeyL: 'c', ShiftLeft: 'c', ShiftRight: 'c',
    Escape: 'menu', KeyM: 'menu', KeyP: 'menu',
  };
  const DIRKEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
  };

  const pointers = new Map(); // id -> {zone, x, y, startX, startY, t0, flicked, held, ox, oy}
  const keysDown = new Set();
  const vkDown = { a: false, b: false, c: false, menu: false };
  const vkPressed = { a: false, b: false, c: false, menu: false };
  const vkReleased = { a: false, b: false, c: false, menu: false };
  let tapPressedA = false;

  const input = {
    events: [],
    stick: { x: 0, y: 0, mag: 0, active: false, ox: 0, oy: 0, px: 0, py: 0 },
    lastWasTouch: false,

    attach(canvas) {
      const opts = { passive: false };
      canvas.addEventListener('pointerdown', onDown, opts);
      window.addEventListener('pointermove', onMove, opts);
      window.addEventListener('pointerup', onUp, opts);
      window.addEventListener('pointercancel', onUp, opts);
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      window.addEventListener('keydown', (e) => {
        if (e.repeat) { if (DIRKEYS[e.code] || KEYMAP[e.code]) e.preventDefault(); return; }
        if (DIRKEYS[e.code] || KEYMAP[e.code]) e.preventDefault();
        input.lastWasTouch = false;
        keysDown.add(e.code);
        const vk = KEYMAP[e.code];
        if (vk) {
          if (!vkDown[vk]) vkPressed[vk] = true;
          vkDown[vk] = true;
          input.events.push({ type: 'key', key: vk, down: true });
        }
        G.audio && G.audio.unlock();
      });
      window.addEventListener('keyup', (e) => {
        keysDown.delete(e.code);
        const vk = KEYMAP[e.code];
        if (vk) {
          // only release if no other key mapping to vk is held
          const still = Object.keys(KEYMAP).some((k) => KEYMAP[k] === vk && keysDown.has(k));
          if (!still) { vkDown[vk] = false; vkReleased[vk] = true; }
          input.events.push({ type: 'key', key: vk, down: false });
        }
      });
      window.addEventListener('blur', () => {
        keysDown.clear();
        // Tell scenes every held pointer ended (cancelled: never counts as a tap).
        const now = performance.now();
        for (const p of pointers.values()) {
          input.events.push({ type: 'up', zone: p.zone, x: p.x, y: p.y, id: p.id, dur: now - p.t0, dist: p.maxDist, held: p.held, flicked: p.flicked, cancelled: true });
        }
        pointers.clear();
        for (const k in vkDown) vkDown[k] = false;
      });
    },

    // --- per-frame queries ------------------------------------------------
    dir4() {
      const s = input.stick;
      if (s.mag < 0.35) return null;
      if (Math.abs(s.x) > Math.abs(s.y)) return s.x > 0 ? 'right' : 'left';
      return s.y > 0 ? 'down' : 'up';
    },
    pressed(k) { return vkPressed[k] || (k === 'a' && tapPressedA); },
    released(k) { return vkReleased[k]; },
    down(k) {
      if (vkDown[k]) return true;
      if (k === 'a') return !!input.rHold();
      return false;
    },
    keyDown(code) { return keysDown.has(code); },
    rHold() { return longest('R'); },
    lHold() { return longest('L'); },
    pointerIn(r) {
      for (const p of pointers.values())
        if (p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h) return true;
      return false;
    },
    consumeTap(r) {
      for (let i = 0; i < input.events.length; i++) {
        const e = input.events[i];
        if (e.type === 'tap' && e.x >= r.x && e.x < r.x + r.w && e.y >= r.y && e.y < r.y + r.h) {
          input.events.splice(i, 1);
          // a tap consumed by UI shouldn't also count as an action press
          if (e.zone === 'R') tapPressedA = false;
          return e;
        }
      }
      return null;
    },
    // Remove every tap (e.g. after a dialog consumed the frame's input).
    consumeAllTaps() {
      input.events = input.events.filter((e) => e.type !== 'tap');
      tapPressedA = false;
      vkPressed.a = false; vkPressed.b = false;
    },
    anyTap() {
      return input.events.some((e) => e.type === 'tap') || vkPressed.a || vkPressed.b;
    },
    has(type, zone) {
      return input.events.find((e) => e.type === type && (!zone || e.zone === zone)) || null;
    },
    // Call once per frame, before scene update.
    poll() {
      // keyboard stick
      let kx = 0, ky = 0;
      for (const code of keysDown) {
        const d = DIRKEYS[code];
        if (d) { kx += d[0]; ky += d[1]; }
      }
      const s = input.stick;
      const lp = longest('L');
      if (lp) {
        let dx = lp.x - lp.ox, dy = lp.y - lp.oy;
        const m = Math.hypot(dx, dy);
        // drag the origin along if thumb goes beyond the ring (feels better)
        if (m > STICK_R * 1.4) {
          lp.ox = lp.x - (dx / m) * STICK_R * 1.4;
          lp.oy = lp.y - (dy / m) * STICK_R * 1.4;
          dx = lp.x - lp.ox; dy = lp.y - lp.oy;
        }
        const mm = Math.hypot(dx, dy);
        const mag = Math.min(1, mm / STICK_R);
        s.x = mm ? (dx / mm) * mag : 0;
        s.y = mm ? (dy / mm) * mag : 0;
        s.mag = mag; s.active = true;
        s.ox = lp.ox; s.oy = lp.oy; s.px = lp.x; s.py = lp.y;
      } else if (kx || ky) {
        const m = Math.hypot(kx, ky);
        s.x = kx / m; s.y = ky / m; s.mag = 1; s.active = false;
      } else {
        s.x = 0; s.y = 0; s.mag = 0; s.active = false;
      }
      // hold events
      const now = performance.now();
      for (const [id, p] of pointers) {
        if (!p.held && !p.flicked && now - p.t0 >= HOLD_MS && p.maxDist < TAP_DIST) {
          p.held = true;
          input.events.push({ type: 'hold', zone: p.zone, x: p.x, y: p.y, id });
        }
      }
    },
    endFrame() {
      input.events.length = 0;
      tapPressedA = false;
      for (const k in vkPressed) { vkPressed[k] = false; vkReleased[k] = false; }
    },
    // Faint stick ring (scenes call this if they want it; overworld + sword do).
    drawStick(ctx) {
      const s = input.stick;
      if (!s.active) return;
      G.draw.circle(s.ox, s.oy, STICK_R, 'rgba(255,255,255,0.08)', 'rgba(255,255,255,0.35)', 1);
      G.draw.circle(s.ox + s.x * STICK_R, s.oy + s.y * STICK_R, 7, 'rgba(255,255,255,0.3)');
    },
    STICK_R,
  };

  function longest(zone) {
    let best = null;
    const now = performance.now();
    for (const [id, p] of pointers) {
      if (p.zone !== zone) continue;
      if (!best || p.t0 < best.t0) best = p;
    }
    if (!best) return null;
    return Object.assign(best, { dur: now - best.t0, dist: Math.hypot(best.x - best.startX, best.y - best.startY) });
  }

  function onDown(e) {
    e.preventDefault();
    G.audio && G.audio.unlock();
    input.lastWasTouch = e.pointerType !== 'mouse';
    const { x, y } = G.gfx.toLogical(e.clientX, e.clientY);
    const zone = x < G.W / 2 ? 'L' : 'R';
    const p = { id: e.pointerId, zone, x, y, startX: x, startY: y, ox: x, oy: y, t0: performance.now(), flicked: false, held: false, maxDist: 0 };
    pointers.set(e.pointerId, p);
    try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    input.events.push({ type: 'down', zone, x, y, id: e.pointerId });
  }
  function onMove(e) {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    const { x, y } = G.gfx.toLogical(e.clientX, e.clientY);
    p.x = x; p.y = y;
    const d = Math.hypot(x - p.startX, y - p.startY);
    p.maxDist = Math.max(p.maxDist, d);

try {
// Core: scene stack + screen transitions.
(() => {
  const stack = [];

  const scenes = {
    stack,
    top: () => stack[stack.length - 1] || null,
    push(s) {
      stack.push(s);
      s.enter && s.enter();
      return s;
    },
    pop() {
      const s = stack.pop();
      s && s.exit && s.exit();
      const t = scenes.top();
      t && t.resume && t.resume();
      return s;
    },
    remove(s) {
      const i = stack.indexOf(s);
      if (i < 0) return;
      stack.splice(i, 1);
      s.exit && s.exit();
      if (i === stack.length) { const t = scenes.top(); t && t.resume && t.resume(); }
    },
    replace(s) {
      while (stack.length) { const o = stack.pop(); o.exit && o.exit(); }
      return scenes.push(s);
    },
    // Fade to color, run fn (may be async), fade back in.
    async fade(fn, o = {}) {
      const ms = o.ms || 280;
      fadeColor = o.color || '#000';
      await tween((t) => (fadeA = t), ms);
      fadeA = 1;
      if (fn) await fn();
      await tween((t) => (fadeA = 1 - t), ms);
      fadeA = 0;
    },
    async fadeOut(o = {}) { fadeColor = o.color || '#000'; await tween((t) => (fadeA = t), o.ms || 280); fadeA = 1; },
    async fadeIn(o = {}) { await tween((t) => (fadeA = 1 - t), o.ms || 280); fadeA = 0; },
    // Pokemon-style battle intro flashes.
    flash(times = 3) {
      flashN = times; flashT = 0;
      return new Promise((r) => G.timers.add(times * 160, r));
    },
    update(dt) {
      const t = scenes.top();
      if (t) t.update(dt);
      if (flashN > 0) { flashT += dt; if (flashT >= flashN * 0.16) flashN = 0; }
    },
    draw(ctx) {
      // find lowest scene that must be drawn
      let i = stack.length - 1;
      while (i > 0 && stack[i].opaque === false) i--;
      for (; i < stack.length; i++) {
        G.gfx.reset();
        ctx.save();
        try { stack[i].draw(ctx); } catch (e) { console.error('draw error in', stack[i].name, e); }
        ctx.restore();
      }
      G.gfx.reset();
    },
    drawOverlay(ctx) {
      if (flashN > 0) {
        const ph = (flashT / 0.16) % 1;
        if (ph < 0.5) { ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, 0, G.W, G.H); }
        else { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, G.W, G.H); }

        ctx.globalAlpha = 1;
      }

  };

    return new Promise((res) => tweens.push({ fn, t: 0, d: ms / 1000, res }));

try {
// Sword roster (DESIGN.md §7a, §12). Stats are derived from the target player
// level so balance stays consistent: `hits` = average player hits (with the
// expected gear at that level) to beat it, `kills` = clean enemy hits needed to
// beat the player. Explicit hp/dmg override the formula.
(() => {
  const R = G.roster.sword;

  // Expected player numbers at level L (stick L1-2, rusty L3-4, iron L5-9, steel L10+).
  const atkAt = (L) => (L <= 2 ? 4 : L <= 4 ? 7 : L <= 9 ? 11 : 18) * (1 + 0.02 * (L - 1)) * 1.17;
  const hpAt = (L) => 40 + 8 * (L - 1) + (L <= 2 ? 0 : L <= 4 ? 6 : L <= 9 ? 12 : L <= 15 ? 20 : 35);
  const pdefAt = (L) => (L <= 2 ? 0 : L <= 4 ? 1 : L <= 9 ? 2 : L <= 15 ? 4 : 7);
  const xpW = (L) => Math.round(5 + 3 * Math.pow(L, 1.2));
  const goldW = (L) => Math.round(2 + 2 * L);

  function add(id, L, o) {
    const def = o.def ?? Math.floor((L - 1) / 4);
    const per = Math.max(1, atkAt(L) - def);
    const hits = o.hits ?? 8, kills = o.kills ?? 7;
    const mult = o.boss ? 3 : o.cup ? 1.5 : 1;
    R[id] = {
      id, level: L,
      name: o.name, title: o.title || '',
      look: o.look,
      hp: o.hp ?? Math.round(per * hits),
      dmg: o.dmg ?? Math.round(hpAt(L) / kills + pdefAt(L)),
      def,
      speed: o.speed ?? +(0.95 + L * 0.013).toFixed(2),
      ai: o.ai, weapon: o.weapon || 'short', shield: !!o.shield,
      aggression: o.aggression ?? 0.55,
      xp: o.xp ?? Math.round(xpW(L) * mult),
      gold: o.gold ?? Math.round(goldW(L) * mult),
      boss: !!o.boss,
      tele: o.tele, // optional telegraph-length multiplier (bigger = slower, kinder)
      wcolor: o.wcolor, scolor: o.scolor,
    };
  }

  // Custom looks (human). Creatures use the strings 'wolf', 'wolf_alpha', 'boar', 'troll', 'dummy'.
  const L = {
    thug: { skin: '#d9a77a', hair: '#2a1a10', hairStyle: 'bald', beard: '#3a2414', tunic: '#6a4a2a', tunic2: '#4a3020', pants: '#3a2a1a', boots: '#1f150e' },
    duelist: { skin: '#f0c9a0', hair: '#3a2414', hairStyle: 'long', tunic: '#2f6a5a', tunic2: '#e8d8a8', pants: '#3a3a30', boots: '#22201a', hat: '#2a4a40' },
    tom: { skin: '#e9b98a', hair: '#8a5a2a', hairStyle: 'short', tunic: '#9a6a3a', apron: '#6a4022', pants: '#5a4632', boots: '#33251a' },

// Battle dispatcher (DESIGN.md §7) + blackout handling.
(() => {
  const makers = {};
  let current = null;

  G.battle = {
    register(type, maker) { makers[type] = maker; },
    get active() { return current; },
    async start(type, opts = {}) {
      const maker = makers[type];
      if (!maker) {
        console.error('no battle type', type);
        return { won: true, hp: G.state.hp };
      }
      const prevMusic = G.music.current;
      G.sfx.play('alert');
      await G.scenes.flash(3);
      let scene;
      const result = await new Promise((resolve) => {
        let finished = false;
        const done = (res) => {
          if (finished) return;
          finished = true;
          resolve(res || { won: false });

  // ======================================================================
  // Item stat comparison
  // ======================================================================
  const STATS = {
    weapon: [['dmg', 'Damage', 1, 'n'], ['speed', 'Swing', -1, 'x'], ['reach', 'Reach', 1, 'n']],
    shield: [['block', 'Block', 1, 'pct'], ['parry', 'Parry', 1, 'ms'], ['def', 'Defense', 1, 'n']],
    armor: [['def', 'Defense', 1, 'n'], ['hp', 'Max HP', 1, 'n'], ['weight', 'Weight', -1, 'pct']],
    lance: [['power', 'Power', 1, 'x'], ['stability', 'Stability', 1, 'pct'], ['breakChance', 'Shatter', 1, 'pct']],
    horse: [['speed', 'Speed', 1, 'x'], ['stamina', 'Stamina', 1, 'x'], ['control', 'Control', 1, 'pct']],
    bow: [['power', 'Power', 1, 'x'], ['steady', 'Steady', 1, 'pct'], ['draw', 'Draw', -1, 's']],
    consumable: [['heal', 'Heals', 1, 'n']],
  };
  const fmtVal = (v, f) => {
    v = v || 0;
    if (f === 'pct') return Math.round(v * 100) + '%';
    if (f === 'x') return '×' + (+v).toFixed(2).replace(/0$/, '');
    if (f === 's') return (+v).toFixed(2).replace(/0$/, '') + 's';
    if (f === 'ms') return Math.round(v) + 'ms';
    return v >= 900 ? 'All' : String(Math.round(v * 10) / 10);
  };
  const fmtDelta = (d, f) => {
    const s = d > 0 ? '+' : '−';
    const a = Math.abs(d);
    if (f === 'pct') return s + Math.round(a * 100) + '%';
    if (f === 'x' || f === 's') return s + a.toFixed(2).replace(/0$/, '');
    return s + Math.round(a * 10) / 10;
  };
  // → [{label, val, delta, good}] ; delta null when no comparison/equal.
  function compare(it, vs) {
    const out = [];
    const defs = STATS[it && it.type] || [];
    for (const [k, label, dir, f] of defs) {
      const v = it[k] || 0;
      let delta = null, good = null;
      if (vs !== undefined && vs !== it) {
        const b = (vs && vs[k]) || 0;
        const d = v - b;
        if (Math.abs(d) > 1e-6) { delta = fmtDelta(d, f); good = d * dir > 0; }

  // Particle bursts used by all menu scenes.
  function makeFx() {
    const list = [];
    return {
      list,
      sparkle(x, y, n = 12, color = '#fff3b0', spd = 50) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random());
          list.push({ k: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, t: 0, life: 0.5 + Math.random() * 0.5, color, r: 1 + Math.random() * 1.5 });
        }
      },
      text(x, y, str, color = '#7fe07a', size = 10) { list.push({ k: 't', x, y, str, color, size, t: 0, life: 1.1 }); },
      coin(x, y, tx, ty, delay = 0) { list.push({ k: 'c', x, y, sx: x, sy: y, tx, ty, t: -delay, life: 0.55 }); },
      update(dt) {
        for (let i = list.length - 1; i >= 0; i--) {
          const p = list[i];
          p.t += dt;
          if (p.k === 'p') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.vx *= 0.97; }
          if (p.k === 't') p.y -= 18 * dt;
          if (p.t > p.life) list.splice(i, 1);
        }
      },
      draw() {
        const c = ctx();
        for (const p of list) {
          if (p.t < 0) continue;
          const k = p.t / p.life;
          if (p.k === 'p') {
            c.globalAlpha = 1 - k;
            D().rect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r, p.color);
            if (p.r > 1.8) { D().rect(p.x - p.r * 1.2, p.y - 0.25, p.r * 2.4, 0.5, p.color); D().rect(p.x - 0.25, p.y - p.r * 1.2, 0.5, p.r * 2.4, p.color); }
          } else if (p.k === 't') {
            c.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
            D().text(p.str, p.x, p.y, { size: p.size, align: 'center', baseline: 'middle', color: p.color, outline: '#2b1d14', outlineW: 2.5, bold: true });
          } else if (p.k === 'c') {

          }
          c.globalAlpha = 1;
        }
      },
    };
  }

  // ======================================================================
  // Immediate-mode navigation context (tap + keyboard focus + scroll areas)
  // ======================================================================
  function makeNav() {
    const n = {
      items: [], prev: [], focus: null, act: null,
      dirHeld: null, rep: 0, cool: 0.18, blocked: false,
      clip: null, area: null, areas: {}, ensure: false, lastT: G.time,
      // Call from scene.update; returns {back, menu, a}.
      update(dt) {
        const out = { back: false, menu: false };
        n.blocked = G.ui.busy();
        if (n.blocked) { n.cool = 0.15; return out; }
        if (n.cool > 0) { n.cool -= dt; n.dirHeld = null; return out; }
        const d = !G.input.stick.active ? G.input.dir4() : null;
        if (d) {
          if (d !== n.dirHeld) { n.dirHeld = d; n.rep = 0.32; n.move(d); }
          else { n.rep -= dt; if (n.rep <= 0) { n.rep = 0.09; n.move(d); } }
        } else n.dirHeld = null;
        if (keyDown('a') && G.input.pressed('a')) {
          if (n.focus == null || !n.prev.some((i) => i.key === n.focus)) n.pickFirst();
          else n.act = n.focus;
        }
        out.back = G.input.pressed('b');
        out.menu = G.input.pressed('menu');
        return out;
      },
      pickFirst() {
        const f = n.prev.find((i) => !i.disabled && i.pri) || n.prev.find((i) => !i.disabled && i.key !== 'close') || n.prev.find((i) => !i.disabled);
        if (f) { n.focus = f.key; n.ensure = true; G.sfx.play('select'); }
      },
      move(d) {
        const list = n.prev.filter((i) => !i.disabled);
        if (!list.length) return;
        const cur = list.find((i) => i.key === n.focus);
        if (!cur) return n.pickFirst();
        const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
        let best = null, bs = 1e9;
        for (const it of list) {
          if (it === cur) continue;
          const ix = it.x + it.w / 2, iy = it.y + it.h / 2;
          const dx = ix - cx, dy = iy - cy;
          let main, side;
          if (d === 'up') { main = -dy; side = Math.abs(dx); }
          else if (d === 'down') { main = dy; side = Math.abs(dx); }
          else if (d === 'left') { main = -dx; side = Math.abs(dy); }
          else { main = dx; side = Math.abs(dy); }
          if (main < 3) continue;
          // overlap on the cross axis is strongly preferred
          const overlap = d === 'up' || d === 'down'
            ? Math.min(cur.x + cur.w, it.x + it.w) - Math.max(cur.x, it.x)
            : Math.min(cur.y + cur.h, it.y + it.h) - Math.max(cur.y, it.y);
          const s = main + side * (overlap > 0 ? 0.3 : 2.5) + (overlap > 0 ? 0 : 40);
          if (s < bs) { bs = s; best = it; }
        }
        if (best) { n.focus = best.key; n.ensure = true; G.sfx.play('select'); }
      },
      begin() { n.prev = n.items; n.items = []; n.clip = null; n.area = null; },
      setFocus(k) { n.focus = k; n.ensure = true; },
      showFocus() { return !G.input.lastWasTouch; },
      // Immediate-mode button. o: {disabled, color, icon, item, size, draw(r, st), pri, sfx}
      btn(key, x, y, w, h, label, o = {}) {
        const r = { x, y, w, h };
        const vis = n.clip ? inter(r, n.clip) : r;
        if (vis) n.items.push({ key, x: vis.x, y: vis.y, w: vis.w, h: vis.h, full: r, area: n.area, disabled: !!o.disabled && !o.focusDisabled, pri: o.pri });
        let hit = false;
        if (!n.blocked && vis && (!o.disabled || o.tapDisabled)) { if (G.input.consumeTap(vis)) hit = true; }
        if (n.act === key) { n.act = null; hit = !o.disabled || !!o.tapDisabled; }
        const st = {
          focused: n.focus === key && n.showFocus(),
          pressed: !n.blocked && vis && G.input.pointerIn(vis),
          disabled: !!o.disabled,
        };
        if (o.draw) o.draw(r, st); else drawBtn(r, label, o, st);
        if (st.focused) {
          const p = 1.5 + Math.sin(G.time * 8) * 0.6;
          D().rrect(x - p, y - p, w + p * 2, h + p * 2, 5, null, '#fff3b0', 1.5);
          D().rrect(x - p - 1, y - p - 1, w + p * 2 + 2, h + p * 2 + 2, 6, null, 'rgba(90,50,10,0.6)', 1);
        }
        if (hit) { n.focus = key; if (o.sfx !== false) G.sfx.play(o.sfx || 'select'); }
        return hit;
      },
      // Scrollable region. fn(oy) draws content with top at oy and returns content height.
      scroll(id, rect, fn, o = {}) {
        const a = n.areas[id] || (n.areas[id] = { y: 0, v: 0, drag: null, ch: 0, lt: G.time });
        const dt = Math.min(0.05, Math.max(0, G.time - a.lt)); a.lt = G.time;
        const max = Math.max(0, a.ch - rect.h);
        if (!n.blocked) {
          for (const e of G.input.events) {
            if (e.type === 'down' && e.x >= rect.x && e.x < rect.x + rect.w && e.y >= rect.y && e.y < rect.y + rect.h) {
              a.drag = { id: e.id, zone: e.zone, y0: e.y, s0: a.y, ly: e.y };
              a.v = 0;
            }
          }
        }
        if (a.drag) {
          const p = a.drag.zone === 'L' ? G.input.lHold() : G.input.rHold();
          if (p && p.id === a.drag.id) {
            let ny = a.drag.s0 - (p.y - a.drag.y0);
            if (ny < 0) ny *= 0.4; else if (ny > max) ny = max + (ny - max) * 0.4;
            if (dt > 0) a.v = U.lerp(a.v, (ny - a.y) / dt, 0.5);
            a.y = ny;
          } else a.drag = null;
        } else {
          a.y += a.v * dt;
          a.v *= Math.pow(0.04, dt);
          if (Math.abs(a.v) < 5) a.v = 0;
          if (a.y < 0) { a.y = U.lerp(a.y, 0, Math.min(1, dt * 14)); if (a.y > -0.3) a.y = 0; a.v = 0; }
          if (a.y > max) { a.y = U.lerp(a.y, max, Math.min(1, dt * 14)); if (a.y < max + 0.3) a.y = max; a.v = 0; }
        }
        if (o.reset) { a.y = 0; a.v = 0; }
        const c = ctx();
        c.save();
        c.beginPath(); c.rect(rect.x, rect.y, rect.w, rect.h); c.clip();
        const pClip = n.clip, pArea = n.area;
        n.clip = pClip ? inter(rect, pClip) || { x: 0, y: 0, w: 0, h: 0 } : rect;
        n.area = id;
        const ch = fn(rect.y - Math.round(a.y)) || 0;
        a.ch = ch;
        n.clip = pClip; n.area = pArea;
        c.restore();
        // keep focus visible
        if (n.ensure) {
          const f = n.items.find((i) => i.key === n.focus && i.area === id);
          if (f) {
            const fr = f.full;
            if (fr.y < rect.y + 2) a.y -= rect.y + 2 - fr.y;
            else if (fr.y + fr.h > rect.y + rect.h - 2) a.y += fr.y + fr.h - (rect.y + rect.h - 2);
            a.y = U.clamp(a.y, 0, Math.max(0, ch - rect.h));
            n.ensure = false;
          }
        }
        // scrollbar + fades
        if (ch > rect.h + 1) {
          const m = Math.max(1, ch - rect.h);
          const th = Math.max(14, rect.h * (rect.h / ch));
          const ty = rect.y + (rect.h - th) * U.clamp(a.y / m, 0, 1);
          D().rrect(rect.x + rect.w - 3, rect.y + 1, 2.5, rect.h - 2, 1.2, 'rgba(90,60,30,0.15)');
          D().rrect(rect.x + rect.w - 3, ty, 2.5, th, 1.2, 'rgba(122,75,42,0.7)');
          const bob = Math.sin(G.time * 5) * 1;
          if (a.y > 2) chevron(rect.x + rect.w / 2, rect.y + 4 - bob, -1);
          if (a.y < m - 2) chevron(rect.x + rect.w / 2, rect.y + rect.h - 4 + bob, 1);
        }
        return a;
      },
      resetScroll(id) { if (n.areas[id]) { n.areas[id].y = 0; n.areas[id].v = 0; } },
    };
    return n;
  }
  function chevron(cx, cy, dir) {
    const c = ctx();
    c.fillStyle = 'rgba(122,75,42,0.85)';
    c.beginPath(); c.moveTo(cx - 5, cy - 2 * dir); c.lineTo(cx + 5, cy - 2 * dir); c.lineTo(cx, cy + 3 * dir); c.fill();
  }
  function drawBtn(r, label, o, st) {
    const base = st.disabled ? '#a39580' : o.color || '#c9893c';
    const oy = st.pressed ? 1 : 0;
    D().rrect(r.x, r.y + 2, r.w, r.h, 4, U.shade(base, -0.5));
    D().rrect(r.x, r.y + oy, r.w, r.h - oy, 4, base, U.shade(base, -0.55), 1);
    D().rrect(r.x + 2, r.y + oy + 1, r.w - 4, Math.max(2, r.h / 2 - 2), 3, 'rgba(255,255,255,0.2)');
    let tx = r.x + r.w / 2, align = 'center';
    if (o.icon) {
      const is = Math.min(14, r.h - 8);
      if (label) {
        const tw = D().measure(label, o.size || 8) + is + 4;
        const ix = r.x + r.w / 2 - tw / 2 + is / 2;
        icon(o.icon, ix, r.y + r.h / 2 + oy, is, { color: o.iconColor, off: o.iconOff });
        tx = ix + is / 2 + 3; align = 'left';
      } else icon(o.icon, r.x + r.w / 2, r.y + r.h / 2 + oy, is, { color: o.iconColor, off: o.iconOff });
    }
    if (label) D().text(label, tx, r.y + r.h / 2 + oy + 0.5, { size: o.size || 8, align, baseline: 'middle', color: st.disabled ? '#ece4d4' : o.textColor || '#fffaf0', shadow: 'rgba(0,0,0,0.45)', bold: true });
  }
  // Card-like list row (parchment tile).
  function drawRow(r, st, o = {}) {
    const sel = o.selected;

    D().rrect(r.x, r.y + oy, r.w, r.h - 0.5, 4, st.disabled ? '#ddd0b4' : base, sel ? '#c9893c' : '#b08a5a', sel ? 1.5 : 1);

  function closeBtn(nav, x, y, s = 24) {

  function goldCounter(x, y, shown, o = {}) {
    const txt = String(Math.round(shown));
    const w = D().measure(txt, 8) + 22;
    const xx = o.align === 'right' ? x - w : x;

  // Generic scene wrapper with open/close animation. def: {update(dt), draw(ctx, k), name}
  function runScene(def) {
    return new Promise((resolve) => {
      let t = 0, closing = -1, result;
      const scene = {
        name: def.name || 'menu',
        opaque: false,
        update(dt) {
          t += dt;
          if (closing >= 0) {
            closing += dt;
            if (closing >= 0.14) { G.scenes.remove(scene); G.input.consumeAllTaps(); resolve(result); }
            return;
          }
          def.update && def.update(dt);
        },
        draw(c) {
          const k = closing >= 0 ? 1 - U.clamp(closing / 0.14, 0, 1) : U.clamp(t / 0.2, 0, 1);
          def.draw(c, k, t);
        },
        resize() { def.resize && def.resize(); },
      };
      def.close = (v) => { if (closing < 0) { closing = 0; result = v; } };
      def.scene = scene;
      G.scenes.push(scene);
    });
  }

  G.mui = {
    icon, itemIcon, itemKind, itemColor, compare, drawCompare, equippedFor, verdict, STATS,
    parchment, inset, chip, ribbon, fancyBar, sealBadge, portraitFrame, makeFx, makeNav,

  // ======================================================================

  const TABS = [
    { id: 'status', name: 'Status', icon: 'person' },
    { id: 'gear', name: 'Gear', icon: 'gear' },
    { id: 'bag', name: 'Bag', icon: 'bag' },

    { id: 'horse', name: 'Horse', type: 'horse' },
    { id: 'bow', name: 'Bow', type: 'bow' },

  let lastTab = 'status';

  function openPause() {
    if (openPause.active) return openPause.active;
    const nav = makeNav();
    const fx = makeFx();
    const S = { tab: lastTab, gearSlot: null, perkSel: null, hpShown: G.state.hp, bagSel: null };
    // Mark current town visited.
    const loc = locOf(G.state.map);
    if (loc && TOWNS.includes(loc)) G.state.flags['visited_' + loc] = true;

    const def = {
      name: 'pause-menu',
      update(dt) {
        fx.update(dt);
        const hp = G.state.hp;
        S.hpShown = U.approach(S.hpShown, hp, Math.max(20, Math.abs(hp - S.hpShown) * 4) * dt);
        const k = nav.update(dt);
        if (k.menu) return def.close();
        if (k.back) {
          if (S.tab === 'gear' && S.gearSlot) { S.gearSlot = null; nav.setFocus('slot_' + (S.lastSlot || 'weapon')); G.sfx.play('cancel'); }
          else if (S.tab === 'perks' && S.perkSel) { S.perkSel = null; G.sfx.play('cancel'); }
          else { G.sfx.play('cancel'); def.close(); }
        }
      },
      draw(c, k) {
        const W = G.W, H = G.H;
        c.globalAlpha = k;
        D().rect(0, 0, W, H, 'rgba(20,12,8,0.62)');
        const L = layout();
        c.save();
        const e = U.ease.outBack(k);
        c.translate(W / 2, H / 2); c.scale(0.9 + 0.1 * e, 0.9 + 0.1 * e); c.translate(-W / 2, -H / 2);
        nav.begin();
        parchment(L.panel.x, L.panel.y, L.panel.w, L.panel.h);
        drawTabs(L);
        // title
        const tab = TABS.find((t) => t.id === S.tab);
        D().text(tab.name, L.title.x, L.title.y, { size: 11, bold: true, color: '#5a3418', baseline: 'middle' });
        if (closeBtn(nav, L.close.x, L.close.y)) def.close();
        const A = L.content;
        try {
          if (S.tab === 'status') tabStatus(A);
          else if (S.tab === 'gear') tabGear(A);
          else if (S.tab === 'bag') tabBag(A);
          else if (S.tab === 'perks') tabPerks(A);
          else if (S.tab === 'map') tabMap(A);
        } catch (err) { console.error('menu tab error', err); }
        fx.draw();
        c.restore();
        c.globalAlpha = 1;
      },
    };

    function layout() {
      const W = G.W, H = G.H, land = W > H * 1.15;

      const panel = { x: Math.round((W - pw) / 2), y: Math.round((H - ph) / 2), w: pw, h: ph };
      if (!land) {
        const tabsY = panel.y + 32;

          foot: { x: panel.x + 8, y: panel.y + panel.h - 33, w: panel.w - 16, h: 24 },

    c.lineTo(A.x, A.y); c.fill();
    // mountains around Kingsroad
    const [hx, hy] = px('harrowfield'), [cx0, cy0] = px('crownhold');
    const mr = U.rng(5);

try {
// Game state, player stats, save/load (DESIGN.md §6).
(() => {
  const SAVE_KEY = 'squires_road_save_v1';

  function fresh() {
    return {
      name: 'Squire', look: 'hero', level: 1, xp: 0, gold: 0, hp: 40,
      perkPoints: 0, perks: {},
      equip: { weapon: 'stick', shield: null, armor: 'tunic', lance: null, horse: null, bow: null },
      bag: { bread: 2 },
      seals: { sword: false, archery: false, joust: false, grand: false },
      flags: {}, map: 'thornbrook_stable', x: 3, y: 3, dir: 'down',
      lastInn: { map: 'thornbrook_stable', x: 3, y: 3 },
      ranks: { sword: 0, archery: 0, joust: 0 },
      wins: {}, defeated: {}, playTime: 0, steps: 0,
    };
  }

  G.state = fresh();

  // Steep early, flatter late so the Kingsroad and Grand Tourney don't need grinding.
  const xpToNext = (L) => Math.round(Math.min(20 * Math.pow(L, 1.45), 150 + 25 * L));

  const player = {
    xpToNext,
    stats() {
      const s = G.state;
      const it = (id) => (id && G.items[id]) || null;
      const weapon = it(s.equip.weapon) || G.items.stick;
      const shield = it(s.equip.shield), armor = it(s.equip.armor);
      const L = s.level;
      const maxHp = 40 + 8 * (L - 1) + (armor ? armor.hp || 0 : 0);
      return {
        level: L,
        maxHp,
        hp: Math.min(s.hp, maxHp),
        atk: weapon.dmg * (1 + 0.02 * (L - 1)),
        def: (armor ? armor.def || 0 : 0) + (shield ? shield.def || 0 : 0),
        maxSta: 100 + 4 * (L - 1),
        speed: 1 - (armor ? armor.weight || 0 : 0),
        weapon, shield, armor,
        lance: it(s.equip.lance), horse: it(s.equip.horse), bow: it(s.equip.bow),
      };
    },
    maxHp() { return player.stats().maxHp; },
    gainXp(n) {
      const s = G.state;
      n = Math.max(0, Math.round(n));
      s.xp += n;
      let ups = 0;
      while (s.level < 30 && s.xp >= xpToNext(s.level)) {
        s.xp -= xpToNext(s.level);
        s.level++;
        s.perkPoints++;
        ups++;
      }
      if (s.level >= 30) s.xp = Math.min(s.xp, xpToNext(30));
      if (ups) {
        s.hp = player.maxHp();
        G.sfx.play('levelup');
        G.ui.toast(`Level up! You are now level ${s.level}. (+1 perk point)`, '#9ff59a');
      }
      return ups;
    },
    addGold(n) {
      G.state.gold = Math.max(0, G.state.gold + Math.round(n));
      if (n > 0) G.sfx.play('coin');
    },
    give(id, qty = 1) {
      if (!G.items[id]) { console.warn('unknown item', id); return; }
      G.state.bag[id] = (G.state.bag[id] || 0) + qty;
    },
    take(id, qty = 1) {
      const b = G.state.bag;
      if (!b[id]) return false;
      b[id] -= qty;
      if (b[id] <= 0) {
        delete b[id];
        // unequip if it was equipped and none left
        for (const k in G.state.equip) if (G.state.equip[k] === id) G.state.equip[k] = k === 'weapon' ? 'stick' : k === 'armor' ? 'tunic' : null;
      }
      return true;
    },
    // Equipped items count as owned.
    has(id) { return !!G.state.bag[id] || Object.values(G.state.equip).includes(id); },
    count(id) { return G.state.bag[id] || 0; },
    // Equip an owned item (moves it out of the bag; old one goes back).
    equip(id) {
      const item = G.items[id];
      if (!item || !G.slotOf[item.type]) return false;
      const slot = G.slotOf[item.type];
      const old = G.state.equip[slot];
      if (old === id) return true;
      if (!G.state.bag[id]) return false;
      player.take(id, 1);
      if (old && old !== 'stick' && old !== 'tunic') player.give(old, 1);
      G.state.equip[slot] = id;
      G.state.hp = Math.min(G.state.hp, player.maxHp());
      return true;
    },
    unequip(slot) {
      const old = G.state.equip[slot];
      if (!old || old === 'stick' || old === 'tunic') return;
      player.give(old, 1);
      G.state.equip[slot] = slot === 'weapon' ? 'stick' : slot === 'armor' ? 'tunic' : null;
      G.state.hp = Math.min(G.state.hp, player.maxHp());
    },
    hasPerk(id) { return !!G.state.perks[id]; },
    heal(amount) {
      const max = player.maxHp();
      G.state.hp = amount === 'full' ? max : Math.min(max, G.state.hp + amount);
    },
    setHp(hp) { G.state.hp = G.U.clamp(Math.round(hp), 0, player.maxHp()); },
    // Best consumable in bag (smallest that is still useful, else biggest)
    bestHealItem(missing) {
      const ids = Object.keys(G.state.bag).filter((id) => G.items[id] && G.items[id].type === 'consumable');
      if (!ids.length) return null;
      ids.sort((a, b) => G.items[a].heal - G.items[b].heal);
      return ids.find((id) => G.items[id].heal >= missing) || ids[ids.length - 1];
    },
    // Use a consumable; returns healed amount or 0.
    useItem(id) {
      const item = G.items[id];
      if (!item || item.type !== 'consumable' || !G.state.bag[id]) return 0;
      const before = G.state.hp;
      player.take(id, 1);
      player.heal(item.heal || 0);
      G.sfx.play('heal');
      return G.state.hp - before;
    },
  };
  G.player = player;

  G.newGame = () => { G.state = fresh(); };
  G.save = () => {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(G.state));
      return true;
    } catch (e) { console.warn('save failed', e); return false; }
  };
  G.hasSave = () => {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (_) { return false; }
  };
  G.load = () => {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      const base = fresh();
      G.state = Object.assign(base, data);
      G.state.equip = Object.assign(fresh().equip, data.equip || {});
      G.state.seals = Object.assign(fresh().seals, data.seals || {});
      G.state.ranks = Object.assign(fresh().ranks, data.ranks || {});
      return true;
    } catch (e) { console.warn('load failed', e); return false; }
  };
  G.deleteSave = () => { try { localStorage.removeItem(SAVE_KEY); } catch (_) { /* ignore */ } };
})();

} catch (e) { console.error('load error in game/state.js', e); }

      const cups = hall.cups || [];
      if (!S.sel && cups.length) S.sel = cups.find((c) => statusOf(c) === 'open') || cups[0];
      let LA, DA;
      const bodyH = P.y + P.h - 8 - top2;
      if (P.land) {
        const lw = Math.floor((P.w - 16) * 0.48);
        LA = { x: P.x + 8, y: top2, w: lw, h: bodyH };
        DA = { x: P.x + 8 + lw + 6, y: top2, w: P.w - 16 - lw - 6, h: bodyH };
      } else {
        const dh = Math.min(210, Math.max(170, bodyH * 0.52));
        LA = { x: P.x + 8, y: top2, w: P.w - 16, h: bodyH - dh - 4 };
        DA = { x: P.x + 8, y: top2 + bodyH - dh, w: P.w - 16, h: dh };
      }
      nav.scroll('cups', LA, (oy) => {
        let y = oy + 1;
        for (const cup of cups) {
          const st = statusOf(cup);
          const d = cupDiscipline(cup);
          const dd = mui.DISC[d] || mui.DISC.mixed;
          const rh = 34;
          if (nav.btn('cup_' + cup.id, LA.x, y, LA.w - 5, rh - 3, '', {
            pri: st === 'open',
            draw(r, bst) {
              mui.drawRow(r, bst, { selected: S.sel === cup, accent: dd.color, fill: st === 'locked' ? '#e6d7b8' : undefined });
              // emblem
              const ex = r.x + 17, ey = r.y + r.h / 2;
              D().circle(ex, ey + 1, 11, 'rgba(60,30,10,0.3)');
              D().circle(ex, ey, 11, st === 'won' ? '#f2c14e' : st === 'locked' ? '#cbb994' : '#f8ebcb', '#7a4b2a', 1);
              if (cup.reward && cup.reward.seal) mui.sealBadge(mui.SEALS.find((s) => s.id === cup.reward.seal) || mui.SEALS[0], ex, ey, 8, st !== 'locked', 0);
              else mui.icon(st === 'won' ? 'trophy' : dd.icon, ex, ey, 14);
              if (st === 'locked') { ctx().globalAlpha = 0.8; mui.icon('lock', ex + 8, ey + 7, 9); ctx().globalAlpha = 1; }
              D().text(cup.name, r.x + 33, r.y + 5, { size: 8, bold: true, color: st === 'locked' ? '#8a7a5a' : '#2b1d14' });
              let x = r.x + 33;
              x += mui.chip(x, r.y + 17, `Lv ${cup.minLevel || 1}`, '#8a7a5a') + 3;
              x += mui.chip(x, r.y + 17, cup.fee ? `${cup.fee}g` : 'Free', cup.fee && G.state.gold < cup.fee ? '#b0453a' : '#a07a3a') + 3;
              x += mui.chip(x, r.y + 17, `${cup.rounds.length} rd${cup.rounds.length > 1 ? 's' : ''}`, '#7a6a5a') + 3;
              // status chip
              const sc = st === 'won' ? ['Won ×' + wins(cup.id), '#c99a2e'] : st === 'locked' ? ['Locked', '#8a7a6a'] : ['Open', '#4a8a3a'];
              mui.chip(r.x + r.w - 5, r.y + 4, sc[0], sc[1], { align: 'right' });
            },
          })) { S.sel = cup; if (!P.land) nav.setFocus('enter'); }
          y += rh;
        }
        return y - oy + 2;
      });
      drawCupDetail(DA);
    }

    function drawCupDetail(A) {
      mui.inset(A.x, A.y, A.w, A.h, 'rgba(255,250,235,0.55)');
      const cup = S.sel;
      if (!cup) {
        D().text('Choose a cup to see its prizes and rules.', A.x + A.w / 2, A.y + A.h / 2 - 6, { size: 7, align: 'center', color: '#8a6a4a', maxW: A.w - 20 });
        return;
      }
      const chk = check(cup);
      const rw = rewardFor(cup);
      let y = A.y + 6;
      D().text(cup.name, A.x + 8, y, { size: 9, bold: true, color: '#2b1d14' });
      y += 12;
      y += D().text(cup.desc || '', A.x + 8, y, { size: 6, color: '#6a4a2a', maxW: A.w - 16, lineH: 7.5 }) + 2;
      // opponents strip
      const opps = [];
      cup.rounds.forEach((r) => oppsOf(r).forEach((o) => opps.push(o)));
      const ps = 16;
      const maxN = Math.floor((A.w - 16) / (ps + 3));
      opps.slice(0, maxN).forEach((o, i) => mui.portraitFrame(o.look, A.x + 9 + i * (ps + 3), y + 1, ps, { bg1: '#d9c08f', bg2: '#b08a5a', edge: '#5a3418' }));
      y += ps + 7;
      // prize line
      D().text(rw.first ? 'PRIZE' : 'PRIZE (repeat: half, no item)', A.x + 8, y, { size: 6, color: '#8a5a2a' });
      y += 9;
      let x = A.x + 8;
      mui.icon('coin', x + 5, y + 6, 10); D().text(`${rw.gold}`, x + 12, y + 6.5, { size: 8, baseline: 'middle', bold: true, color: '#3a2414' });
      x += 18 + D().measure(String(rw.gold), 8) + 4;
      D().text(`${rw.xp} XP`, x, y + 6.5, { size: 8, baseline: 'middle', bold: true, color: '#2f6fa8' });
      x += D().measure(`${rw.xp} XP`, 8) + 8;
      const it = rw.item && G.items[rw.item];
      if (it) {
        mui.itemIcon(it, x + 8, y + 6, 10);
        const nm = (rw.qty > 1 ? rw.qty + '× ' : '') + it.name;
        D().text(nm, x + 17, y + 6.5, { size: 7, baseline: 'middle', color: '#3a2414', maxW: A.x + A.w - x - 20 });
      }
      y += 15;
      if (cup.reward && cup.reward.seal) {
        const sd = mui.SEALS.find((s) => s.id === cup.reward.seal);
        if (sd) {
          mui.sealBadge(sd, A.x + 14, y + 5, 6, true, G.time);
          D().text(G.state.seals[sd.id] ? `${sd.name} (earned)` : `+ ${sd.name}!`, A.x + 24, y + 5.5, { size: 7, baseline: 'middle', bold: true, color: sd.color });
          y += 14;
        }
      }
      // requirements
      const btnH = 24;
      const reqBottom = A.y + A.h - btnH - 10;
      for (const r of chk.reasons) {
        if (y + 8 > reqBottom) break;
        mui.icon(r.ok ? 'check' : 'lock', A.x + 13, y + 4, 8, { color: '#5bb04a' });
        D().text(r.text, A.x + 21, y + 4.5, { size: 6, baseline: 'middle', color: r.ok ? '#4a6a3a' : '#b0453a' });
        y += 9;
      }
      // enter button
      const bw = Math.min(A.w - 16, 150), bx = A.x + A.w - bw - 8, by = A.y + A.h - btnH - 8;
      const label = !chk.ok ? 'Locked' : !chk.afford ? `Need ${cup.fee}g` : cup.fee ? `Enter (${cup.fee}g)` : 'Enter';
      if (nav.btn('enter', bx, by, bw, btnH, label, { color: chk.ok && chk.afford ? '#b8442f' : '#a39580', icon: chk.ok ? 'trophy' : 'lock', tapDisabled: true, sfx: false, pri: true })) {
        if (!chk.ok) {
          G.sfx.play('cancel');
          const why = chk.reasons.find((r) => !r.ok);
          fx.text(bx + bw / 2, by - 6, why ? why.text : 'Locked', '#ffb08a', 8);
        } else if (!chk.afford) {
          G.sfx.play('cancel');
          fx.text(bx + bw / 2, by - 6, `Entry is ${cup.fee} gold`, '#ffb08a', 8);
        } else {
          G.sfx.play('confirm');
          startCup(cup);
        }
      }
    }

    // -------------------------------------------------- the cup flow
    async function startCup(cup) {
      S.cup = cup; S.round = 0; S.results = []; S.paid = false;
      setMode('ladder');
      const go = await waitBtn();
      if (go !== 'go') return; // backed out to hall
      if (cup.fee) { G.state.gold -= cup.fee; G.sfx.play('coin'); }
      S.paid = true;
      const n = cup.rounds.length;
      let won = true;
      for (let i = 0; i < n; i++) {
        S.round = i;
        if (i > 0) {
          setMode('ladder');
          await waitBtn();
        }
        const round = cup.rounds[i];
        const opps = oppsOf(round);
        G.player.heal('full'); // sword HP restored before every match
        S.card = { title: round.label || (i === n - 1 ? 'Final' : `Round ${i + 1}`), sub: `Round ${i + 1} of ${n}`, names: opps.map((o) => o.name).join(' & '), dur: 1.7, kind: 'round' };
        setMode('card');
        G.sfx.play('horn');
        await waitBtn();
        const opts = Object.assign({}, round.opts || {});
        if (!opts.title) opts.title = `${cup.name} — ${S.card.title}`;
        let res;
        try { res = await G.battle.start(round.type, opts); } catch (e) { console.error('battle error', e); res = { won: false }; }
        res = res || { won: false };
        S.results.push(!!res.won);
        G.player.heal('full');
        if (!res.won) { won = false; break; }
        if (i < n - 1) {
          S.card = { title: 'Advance!', sub: `${opps.map((o) => o.name).join(' & ')} defeated`, names: '', dur: 1.3, kind: 'advance' };
          setMode('card');
          G.sfx.play('crowd');
          G.sfx.play('confirm');
          await waitBtn();
        }
      }
      if (won) await rewardPhase(cup);
      else await elimPhase(cup);
      G.player.heal('full');
      G.save();
      def.close({ won, cupId: cup.id });
    }

    async function rewardPhase(cup) {
      const rw = rewardFor(cup);
      const d = cupDiscipline(cup);
      // rank up: first win of a tier in this discipline
      let rankUp = null;
      if (rw.first && G.state.ranks && G.state.ranks[d] != null && RANK_TIERS.includes(cup.tier)) {
        let before = false;
        for (const hid in G.halls) for (const c of G.halls[hid].cups || []) {
          if (c !== cup && c.tier === cup.tier && cupDiscipline(c) === d && wins(c.id) > 0) before = true;
        }
        if (!before) {
          const from = G.state.ranks[d];
          G.state.ranks[d] = from + 1;
          rankUp = { from: mui.rankTitle(from), to: mui.rankTitle(from + 1), d };
        }
      }
      G.state.wins = G.state.wins || {};
      G.state.wins[cup.id] = wins(cup.id) + 1;
      const goldBefore = G.state.gold, levelBefore = G.state.level;
      G.player.addGold(rw.gold);
      const ups = G.player.gainXp(rw.xp);
      if (rw.item && G.items[rw.item]) G.player.give(rw.item, rw.qty);
      if (rw.seal) G.state.seals[rw.seal] = true;
      // timeline
      let t = 0.7;
      const tl = { gold: t, xp: (t += 0.9), item: rw.item ? (t += 0.9) : null, seal: rw.seal ? (t += 0.9) : null, rank: rankUp ? (t += 1.2) : null };
      tl.end = t + 0.8;
      S.reward = { rw, rankUp, tl, end: tl.end, goldBefore, levelBefore, ups, fired: {} };
      setMode('reward');
      G.music.play('victory');
      G.sfx.play('win');
      await waitBtn();
    }
    function stepReward() {
      if (S.mode !== 'reward') return;
      const R = S.reward, f = R.fired, t = S.t;
      const P = rewardLayout();
      if (!f.gold && t >= R.tl.gold) { f.gold = 1; G.sfx.play('coin'); fx.sparkle(P.trophy.x, P.trophy.y, 20, '#ffe48a', 80); }
      if (R.tl.item != null && !f.item && t >= R.tl.item) { f.item = 1; G.sfx.play('confirm'); fx.sparkle(P.item.x, P.item.y, 14, '#fff3b0', 60); }
      if (R.tl.seal != null && !f.seal && t >= R.tl.seal) {
        f.seal = 1;
        G.cmd.seal(R.rw.seal);
        fx.sparkle(P.seal.x, P.seal.y - 8, 30, '#ffe48a', 100);
        fx.sparkle(P.seal.x, P.seal.y - 8, 16, '#ffffff', 60);
      }
      if (R.tl.rank != null && !f.rank && t >= R.tl.rank) { f.rank = 1; G.sfx.play('levelup'); fx.sparkle(P.rank.x, P.rank.y, 20, '#d9b8ff', 80); }
      if (S.skipped) {
        // fire everything that was skipped (once)
        if (R.tl.seal != null && !f.seal) { f.seal = 1; G.cmd.seal(R.rw.seal); }
        S.skipped = false;
      }
    }
    async function elimPhase(cup) {
      const rw = rewardFor(cup);
      const n = cup.rounds.length;
      const wonRounds = S.results.filter(Boolean).length;
      const xp = Math.floor((rw.xp / n) * wonRounds * 0.5);
      if (xp > 0) G.player.gainXp(xp);
      S.elim = { xp, wonRounds, n };
      setMode('elim');
      G.sfx.play('lose');
      await waitBtn();
    }

    // -------------------------------------------------- ladder screen
    function drawLadder() {
      const P = panelRect();
      const cup = S.cup;
      const n = cup.rounds.length;
      const land = P.land;
      mui.parchment(P.x, P.y, P.w, P.h);
      const dcol = (mui.DISC[cupDiscipline(cup)] || mui.DISC.mixed).color;
      mui.ribbon(P.x + P.w / 2, P.y + 8, Math.min(P.w - 40, D().measure(cup.name, 10) + 40), cup.name, dcol, { size: 10, h: 18 });
      D().text(hall.name, P.x + P.w / 2, P.y + 33, { size: 6, align: 'center', color: '#7a4b2a' });
      const btnH = 26;
      const by = P.y + P.h - 10 - btnH;
      // ---- bracket row
      const colTop = P.y + (land ? 40 : 44);
      const cw = (P.w - 16) / n;
      const ps = U.clamp(cw - 12, 18, land ? 24 : 36);
      const nameLines = land ? 1 : 2;
      const rowH = 28 + ps + 6 + nameLines * 7;
      for (let i = 0; i < n; i++) {
        const r = cup.rounds[i];
        const opps = oppsOf(r);
        const cx = P.x + 8 + cw * (i + 0.5);
        const state = i < S.results.length ? (S.results[i] ? 'beat' : 'lost') : i === S.round ? 'now' : 'next';
        ctx().font = D().font(6, true);
        const lab = U.wrapText(ctx(), r.label || (i === n - 1 ? 'Final' : `Round ${i + 1}`), cw - 2).slice(0, 2);
        lab.forEach((l, k2) => D().text(l, cx, colTop + k2 * 7 + (lab.length === 1 ? 3 : 0), { size: 6, align: 'center', color: state === 'now' ? '#b8442f' : '#7a5a3a', bold: true }));
        const py = colTop + 26;
        const m = opps.length;
        const off = m > 1 ? Math.min(ps * 0.45, (cw - 6 - ps) / (m - 1)) : 0;
        const gw = ps + off * (m - 1);
        const startX = cx - gw / 2;
        if (state === 'now') {
          const g = 0.5 + 0.5 * Math.sin(G.time * 5);
          D().rrect(startX - 4, py - 4, gw + 8, ps + 8, 6, `rgba(255,214,100,${0.35 + 0.35 * g})`);
          const b = Math.abs(Math.sin(G.time * 4)) * 2;
          ctx().fillStyle = '#d6453d';
          ctx().beginPath(); ctx().moveTo(cx - 4, py - 11 - b); ctx().lineTo(cx + 4, py - 11 - b); ctx().lineTo(cx, py - 6 - b); ctx().fill();
        }
        opps.forEach((o, j) => mui.portraitFrame(o.look, startX + j * off, py, ps, { dim: state === 'beat', edge: state === 'now' ? '#b8442f' : '#5a3418', bg1: '#e8c88a', bg2: '#b07a4a' }));
        if (state === 'beat') {
          const yy = py + ps / 2;
          D().line(cx - ps * 0.32, yy - ps * 0.32, cx + ps * 0.32, yy + ps * 0.32, '#c0392b', 2.5);
          D().line(cx + ps * 0.32, yy - ps * 0.32, cx - ps * 0.32, yy + ps * 0.32, '#c0392b', 2.5);
        }
        ctx().font = D().font(6, true);
        const lines = U.wrapText(ctx(), opps.map((o) => o.name).join(' & '), cw - 3).slice(0, nameLines);
        lines.forEach((l, k) => D().text(l, cx, py + ps + 3 + k * 7, { size: 6, align: 'center', color: state === 'beat' ? '#9a8466' : '#3a2414' }));
        if (i < n - 1) {
          const x1 = startX + gw + 3, x2 = P.x + 8 + cw * (i + 1.5) - (ps + (oppsOf(cup.rounds[i + 1]).length > 1 ? ps * 0.45 : 0)) / 2 - 3;
          if (x2 > x1 + 2) {
            ctx().setLineDash([2, 2]);
            D().line(x1, py + ps / 2, x2, py + ps / 2, i < S.results.length ? '#c9893c' : 'rgba(90,60,30,0.4)', 1.2);
            ctx().setLineDash([]);
          }
        }
        if (i === n - 1 && state !== 'now') mui.icon('trophy', startX + gw, py - 2, 10);
      }
      // ---- duel panel: you vs the current opponent(s)
      const dy = colTop + rowH + 4, dh = by - 8 - dy;
      mui.inset(P.x + 10, dy, P.w - 20, dh, 'rgba(255,250,235,0.45)');
      const cur = S.round < n ? oppsOf(cup.rounds[S.round]) : [];
      const curNames = cur.map((o) => o.name).join(' & ');
      const pulse = 1 + Math.sin(G.time * 6) * 0.05;
      const vsBadge = (x, y, r) => {
        D().circle(x, y + 1.5, r * pulse, '#5a1e12');
        D().circle(x, y, r * pulse, '#b8442f', '#5a1e12', 1.5);
        D().text('VS', x, y + 0.5, { size: r * 0.75, align: 'center', baseline: 'middle', bold: true, color: '#fff3d6', outline: '#5a1e12', outlineW: 2 });
      };
      if (dh < 80) {
        // compact single-row duel (short landscape screens)
        const s2 = Math.max(16, dh - 8), cy = dy + dh / 2;
        mui.portraitFrame(G.state.look || 'hero', P.x + 16, cy - s2 / 2, s2, { edge: '#3b6fc4' });
        D().text(G.state.name || 'You', P.x + 22 + s2, cy - 4, { size: 8, bold: true, baseline: 'middle', color: '#2b1d14' });
        D().text(`Level ${G.state.level}`, P.x + 22 + s2, cy + 6, { size: 6, baseline: 'middle', color: '#7a4b2a' });
        vsBadge(P.x + P.w / 2, cy, 11);
        const m = cur.length, off = s2 * 0.55;
        const ox = P.x + P.w - 16 - s2 - off * (m - 1);
        cur.forEach((o, j) => mui.portraitFrame(o.look, ox + j * off, cy - s2 / 2, s2, { edge: '#b8442f', bg1: '#f0c8a0', bg2: '#b07a4a' }));
        D().text(curNames, ox - 6, cy, { size: 7, bold: true, align: 'right', baseline: 'middle', color: '#2b1d14', maxW: 0 });
      } else {
        const big = U.clamp(Math.min((P.w - 20) * 0.27, dh - 40), 24, 72);
        const lx = P.x + 10 + (P.w - 20) * 0.25, rx = P.x + 10 + (P.w - 20) * 0.75;
        const cy = dy + dh / 2 - 6;
        D().circle(lx, cy, big * 0.75, 'rgba(255,240,190,0.5)');
        D().circle(rx, cy, big * 0.75, 'rgba(255,200,170,0.4)');
        mui.portraitFrame(G.state.look || 'hero', lx - big / 2, cy - big / 2, big, { edge: '#3b6fc4' });
        D().text(G.state.name || 'You', lx, cy + big / 2 + 5, { size: 8, align: 'center', bold: true, color: '#2b1d14' });
        D().text(`Level ${G.state.level}`, lx, cy + big / 2 + 15, { size: 6, align: 'center', color: '#7a4b2a' });
        const m = cur.length;
        const ob = m > 1 ? big * 0.75 : big;
        const off = m > 1 ? Math.min(ob * 0.5, ((P.w - 20) * 0.45 - ob) / (m - 1)) : 0;
        cur.forEach((o, j) => mui.portraitFrame(o.look, rx - (ob + off * (m - 1)) / 2 + j * off, cy - ob / 2 + (j % 2) * 4, ob, { edge: '#b8442f', bg1: '#f0c8a0', bg2: '#b07a4a' }));
        ctx().font = D().font(7, true);
        U.wrapText(ctx(), curNames, (P.w - 20) * 0.46).slice(0, 3)
          .forEach((l, k) => D().text(l, rx, cy + big / 2 + 5 + k * 9, { size: 7, align: 'center', bold: true, color: '#2b1d14' }));
        vsBadge(P.x + P.w / 2, cy, 13);
        D().text(`Round ${Math.min(S.round + 1, n)} of ${n}`, P.x + P.w / 2, dy + 5, { size: 6, align: 'center', color: '#8a5a2a' });
        // prize preview
        const rw = rewardFor(cup);
        const it = rw.item && G.items[rw.item];
        const py2 = dy + 18;
        const txt = `${rw.gold}g  ·  ${rw.xp} XP` + (it ? '  ·  ' + it.name : '') + (rw.seal ? '  ·  Seal' : '');
        const tw = D().measure(txt, 7) + 22;
        mui.icon('trophy', P.x + P.w / 2 - tw / 2 + 6, py2 + 4, 10);
        D().text(txt, P.x + P.w / 2 - tw / 2 + 14, py2 + 4.5, { size: 7, baseline: 'middle', color: '#5a3418', bold: true });
      }
      // ---- buttons
      if (S.mode !== 'ladder') return;
      if (!S.paid) {
        const bw = Math.min(140, (P.w - 30) * 0.6);
        if (nav.btn('back', P.x + 10, by, P.w - 30 - bw, btnH, 'Back', { color: '#8a6a4a', sfx: 'cancel' })) { setMode('hall'); resolveWait('back'); }
        if (nav.btn('go', P.x + P.w - 10 - bw, by, bw, btnH, cup.fee ? `Begin (${cup.fee}g)` : 'Begin!', { color: '#b8442f', icon: 'trophy', pri: true, sfx: 'confirm' })) resolveWait('go');
      } else {
        const bw = Math.min(180, P.w - 20);
        if (nav.btn('go', P.x + P.w / 2 - bw / 2, by, bw, btnH, S.round === n - 1 ? 'To the Final!' : `Fight Round ${S.round + 1}!`, { color: '#b8442f', icon: 'weapon', pri: true, sfx: 'confirm' })) resolveWait('go');
      }
      if (!nav.focus && !G.input.lastWasTouch) nav.focus = 'go';
    }

    // -------------------------------------------------- cards
    function drawCard() {
      const c = ctx(), W = G.W, H = G.H, C = S.card;
      const k = U.clamp(S.t / 0.25, 0, 1), out = U.clamp((S.t - (C.dur - 0.25)) / 0.25, 0, 1);
      c.globalAlpha = 0.75 * k * (1 - out);
      D().rect(0, 0, W, H, '#140a05');
      c.globalAlpha = 1 - out;
      const e = U.ease.outBack(k);
      const cy = H / 2;
